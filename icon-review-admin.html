<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>良友图标审核后台</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b101a;color:#f5f1e8}main{max-width:1100px;margin:auto;padding:24px 16px 80px}h1{font-size:28px;margin:20px 0 6px}.muted{color:#a6afbd;line-height:1.7}.panel,.item{background:#151e2c;border:1px solid #354153;border-radius:20px;padding:20px;margin:16px 0}input,select{background:#0c1420;border:1px solid #596578;color:white;border-radius:12px;padding:14px;font-size:16px;max-width:100%;width:100%}button{background:#e5c98e;border:0;color:#211b13;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#344257;color:white}.danger{background:#a95058;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.item{margin:0}.item img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#080d15;border-radius:15px}.item h2{font-size:21px;overflow-wrap:anywhere}.item p{overflow-wrap:anywhere}.tag{font-size:12px;color:#ebd39b}.hidden{display:none}a{color:#ebd39b}</style></head><body><main><a href="./#library">← 返回资源中心</a><h1>良友图标 · 审核后台</h1><p class="muted">仅管理员使用。查看待审核图标；点击「通过并发布」将同步正式图标库及两份订阅 JSON，拒绝只处理未发布投稿；「下架」会移除两份订阅中的记录，保留原图片。</p><section class="panel"><label for="key">管理员密钥（仅本次页面使用，不保存到浏览器）</label><div class="row"><input id="key" type="password" autocomplete="off" placeholder="粘贴 Cloudflare ADMIN_KEY"><button id="load">进入后台 / 刷新</button></div><p id="message" class="muted" role="status">请先在 Cloudflare Worker 设置 ADMIN_KEY 加密密钥。</p><div class="row"><label>状态筛选 <select id="filter"><option value="pending">待审核</option><option value="all">全部</option><option value="approved">已通过</option><option value="rejected">已拒绝</option><option value="withdrawn">已下架</option></select></label><label>搜索名称 <input id="search" placeholder="搜索图标名称或作者"></label></div></section><p id="count" class="muted"></p><div id="items"></div></main><script>
const API="https://liangyou-icon-review.maddestalistar.workers.dev/admin";
const $=id=>document.getElementById(id);let entries=[],busy=false;
const statusName={pending:"待审核",approved:"已通过",rejected:"已拒绝",withdrawn:"已下架"};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function render(){
 const filter=$("filter").value,search=$("search").value.toLowerCase();
 const list=entries.filter(x=>(filter==="all"||x.status===filter)&&((x.name||"").toLowerCase().includes(search)||(x.author||"").toLowerCase().includes(search)));
 $("count").textContent="共 "+list.length+" 条记录";const wrap=$("items");wrap.replaceChildren();
 for(const x of list){
  const card=el("article",undefined,"item"),img=el("img");img.src=x.imageUrl;img.alt=x.name||"投稿图标";img.loading="lazy";
  card.append(img,el("h2",x.name),el("p","作者："+(x.author||"未知")),el("p","类型："+(x.kind||"未知")+" · "+(x.width||"?")+"×"+(x.height||"?")),el("p","说明："+(x.notes||"无")),el("p","状态："+(statusName[x.status]||x.status),"tag"),el("p","编号："+x.id));
  if(x.status==="approved"){
   card.append(el("p",x.publicationVerifiedAt?"正式库核对成功："+new Date(x.publicationVerifiedAt).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai"})+" 北京时间":"旧审核记录：可点击「核对发布」确认图片及两份订阅均有效。","muted"));
   if(x.publishedName)card.append(el("p","正式名称："+x.publishedName));
   if(typeof x.publishedUrl==="string"&&x.publishedUrl.startsWith("https://raw.githubusercontent.com/MaddestAlistar/LiangYou-IconLibrary/main/icons/liangyou/")){
    const a=el("a","查看正式库图片 ↗");a.href=x.publishedUrl;a.target="_blank";a.rel="noopener noreferrer";card.append(a);
   }
  }
  if(x.status==="withdrawn")card.append(el("p","已从两份正式订阅移除。客户端刷新订阅后生效；原图片保留用于追溯。"+(x.withdrawnAt?" 下架时间："+new Date(x.withdrawnAt).toLocaleString("zh-CN",{timeZone:"Asia/Shanghai"})+" 北京时间":""),"muted"));
  const actions=el("div",undefined,"row");
  const choices=x.status==="withdrawn"?[["withdrawn","核对下架","secondary"]]:[["approved",x.status==="approved"?"核对发布":"通过并发布",""],["rejected","拒绝","danger"],["pending","恢复待审核","secondary"],...(x.status==="approved"||x.publishedUrl?[["withdrawn","下架","danger"]]:[])];
  for(const [state,label,cls] of choices){
   const btn=el("button",label,cls);btn.disabled=busy||(!["approved","withdrawn"].includes(state)&&(x.status===state||x.status==="approved"||!!x.publishedUrl));
   btn.onclick=async()=>{
    if(busy)return;
    if(state==="approved"&&x.status!=="approved"&&!confirm("确认通过并发布「"+x.name+"」到正式图标库？"))return;
    if(state==="withdrawn"&&x.status!=="withdrawn"&&!confirm("确认下架「"+(x.publishedName||x.name)+"」？\n将从完整库和精选库两份订阅中移除。原图片保留，客户端刷新订阅后生效。"))return;
    if(!["approved","withdrawn"].includes(state)&&!confirm("确认将「"+x.name+"」标记为「"+label+"」？"))return;
    busy=true;$("load").disabled=true;render();$("message").textContent=state==="approved"?"正在核验并发布，请勿重复操作…":state==="withdrawn"?"正在同步下架并核对两份订阅，请稍候…":"正在保存审核状态…";
    try{
     const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":$("key").value},body:JSON.stringify({path:x.metaPath,status:state}),signal:AbortSignal.timeout(120000)});
     const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||"操作失败");
     Object.assign(x,data.item||{status:state});
     $("message").textContent=data.withdrawalVerified?"下架成功：两份正式订阅均已确认移除。客户端刷新订阅后生效；已下载或已应用的图标可能仍保留本地缓存。":data.publicationVerified?"发布核验成功：图片及两份订阅均已确认。客户端可刷新图标订阅；CDN 缓存可能短暂延迟。":"已更新 "+x.name+" → "+label;
    }catch(e){$("message").textContent="未能确认完成："+e.message+"。请刷新记录后重试；同一投稿不会重复入库。"}
    finally{busy=false;$("load").disabled=false;render()}
   };actions.append(btn);
  }
  card.append(actions);wrap.append(card);
 }
}
$("load").onclick=async()=>{
 if(busy)return;if(!$("key").value){$("message").textContent="请输入管理员密钥";return}
 busy=true;$("load").disabled=true;render();$("message").textContent="正在加载投稿记录…";
 try{
  let cursor=null,loaded=[],pages=0;
  do{
   const r=await fetch(API+(cursor===null?"":"?cursor="+cursor),{headers:{"X-Admin-Key":$("key").value},signal:AbortSignal.timeout(30000)});
   const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||"读取失败");
   loaded.push(...(data.items||[]));cursor=data.nextCursor??null;
   if(++pages>100)throw Error("投稿记录过多，请缩小审核队列后重试");
  }while(cursor!==null);
  entries=loaded.sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)));
  $("message").textContent="加载成功。通过时会核对两份正式订阅；已通过记录可再次核对，不会重复发布。";
 }catch(e){$("message").textContent="读取失败："+e.message}
 finally{busy=false;$("load").disabled=false;render()}
};
$("filter").onchange=render;$("search").oninput=render;
</script></body></html>
