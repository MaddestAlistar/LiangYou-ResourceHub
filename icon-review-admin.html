<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>良友图标审核后台</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b101a;color:#f5f1e8}main{max-width:1100px;margin:auto;padding:24px 16px 80px}h1{font-size:28px;margin:20px 0 6px}.muted{color:#a6afbd;line-height:1.7}.panel,.item{background:#151e2c;border:1px solid #354153;border-radius:20px;padding:20px;margin:16px 0}input,select{background:#0c1420;border:1px solid #596578;color:white;border-radius:12px;padding:14px;font-size:16px;max-width:100%;width:100%}button{background:#e5c98e;border:0;color:#211b13;border-radius:12px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.45}.secondary{background:#344257;color:white}.danger{background:#a95058;color:white}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.item{margin:0}.item img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#080d15;border-radius:15px}.item h2{font-size:21px;overflow-wrap:anywhere}.item p{overflow-wrap:anywhere}.tag{font-size:12px;color:#ebd39b}.hidden{display:none}a{color:#ebd39b}</style></head><body><main><a href="./#library">← 返回资源中心</a><h1>良友图标 · 审核后台</h1><p class="muted">仅管理员使用。查看待审核图标；点击「通过并发布」将同步正式图标库及两份订阅 JSON，拒绝只更新审核状态。</p><section class="panel"><label for="key">管理员密钥（仅本次页面使用，不保存到浏览器）</label><div class="row"><input id="key" type="password" autocomplete="off" placeholder="粘贴 Cloudflare ADMIN_KEY"><button id="load">进入后台 / 刷新</button></div><p id="message" class="muted" role="status">请先在 Cloudflare Worker 设置 ADMIN_KEY 加密密钥。</p><div class="row"><label>状态筛选 <select id="filter"><option value="pending">待审核</option><option value="all">全部</option><option value="approved">已通过</option><option value="rejected">已拒绝</option></select></label><label>搜索名称 <input id="search" placeholder="搜索图标名称或作者"></label></div></section><p id="count" class="muted"></p><div id="items"></div></main><script>
const API="https://liangyou-icon-review.maddestalistar.workers.dev/admin";const $=x=>document.getElementById(x);let entries=[];
const statusName={pending:"待审核",approved:"已通过",rejected:"已拒绝"};
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function render(){const filter=$("filter").value,search=$("search").value.toLowerCase();const list=entries.filter(x=>(filter==="all"||x.status===filter)&&((x.name||"").toLowerCase().includes(search)||(x.author||"").toLowerCase().includes(search)));$("count").textContent="共 "+list.length+" 条记录";const wrap=$("items");wrap.replaceChildren();for(const x of list){const card=el("article",undefined,"item");const img=el("img");img.src=x.imageUrl;img.alt=x.name||"投稿图标";img.loading="lazy";card.append(img,el("h2",x.name),el("p","作者："+(x.author||"未知")),el("p","类型："+(x.kind||"未知")+" · "+(x.width||"?")+"×"+(x.height||"?")),el("p","说明："+(x.notes||"无")),el("p","状态："+(statusName[x.status]||x.status),"tag"),el("p","编号："+x.id));const actions=el("div",undefined,"row");for(const [state,label,cls] of [["approved","通过并发布",""],["rejected","拒绝","danger"],["pending","恢复待审核","secondary"]]){const btn=el("button",label,cls);btn.disabled=x.status===state;btn.onclick=async()=>{if(!confirm("确认将「"+x.name+"」标记为「"+label+"」？"))return;btn.disabled=true;try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","X-Admin-Key":$("key").value},body:JSON.stringify({path:x.metaPath,status:state})});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||"操作失败");x.status=state;render();$("message").textContent="已更新 "+x.name+" → "+label}catch(e){$("message").textContent="更新失败："+e.message;btn.disabled=false}};actions.append(btn)}card.append(actions);wrap.append(card)}}
$("load").onclick=async()=>{if(!$("key").value){$("message").textContent="请输入管理员密钥";return}$("message").textContent="正在加载投稿记录…";try{const r=await fetch(API,{headers:{"X-Admin-Key":$("key").value}});const data=await r.json();if(!r.ok||!data.ok)throw Error(data.error||"读取失败");entries=data.items||[];render();$("message").textContent="加载成功。通过会发布到正式图标库并更新订阅；拒绝只修改审核状态。"}catch(e){$("message").textContent="读取失败："+e.message}};$("filter").onchange=render;$("search").oninput=render;
</script></body></html>
