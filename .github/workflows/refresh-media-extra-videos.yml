name: Refresh matched film videos from public platforms

on:
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-media-extra-videos.yml'
      - 'scripts/refresh_media_extra_videos.py'
      - 'scripts/refresh_media_bilibili_covers.py'
      - 'scripts/test_media_extra_videos.py'
      - 'scripts/test_media_domestic_trailers.mjs'
      - 'media-insights.js'

permissions:
  contents: write

concurrency:
  group: media-extra-videos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify film matching and provider URL contracts
        run: |
          python -m py_compile scripts/refresh_media_extra_videos.py scripts/refresh_media_bilibili_covers.py
          cd scripts && python -m unittest -v test_media_extra_videos
      - name: Verify gallery UI syntax and 20-video contract
        run: |
          node --check media-insights.js
          node --test scripts/test_media_domestic_trailers.mjs scripts/test_media_player.mjs
      - name: Refresh cached metadata for a rotating title batch
        env:
          EXTRA_VIDEOS_BATCH: '12'
        run: python scripts/refresh_media_extra_videos.py
      - name: Refresh hand-verified Bilibili cover URLs
        run: python scripts/refresh_media_bilibili_covers.py
      - name: Validate snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/media-extra-videos.json')
          d=json.loads(p.read_text())
          assert d['schema']==1 and isinstance(d['items'],dict)
          assert len(d['items'])<=450 and p.stat().st_size<1800000
          for key,row in d['items'].items():
              kind,id=key.split(':')
              assert kind in ('movie','tv') and int(id)>0
              assert row['kind']==kind and row['tmdbId']==int(id)
              assert len(row.get('videos',[]))<=15
              assert len(row.get('youtubeTrailers',[]))<=10
              assert all(v.get('platform') in ('acfun','niconico','dailymotion') and
                         v.get('matchedByTitle') is True and
                         v.get('tmdbId')==int(id) for v in row.get('videos',[]))
          print('EXTRA_VIDEO_SNAPSHOT_OK',len(d['items']))
          PY
      - name: Commit cache safely to this branch (no Pages deployment step)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/media-extra-videos.json /tmp/liangyou-media-extra-videos.json
          cp data/media-domestic-trailers.json /tmp/liangyou-bilibili-covers.json
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            cp /tmp/liangyou-media-extra-videos.json data/media-extra-videos.json
            # Merge only verified cover fields into the fresh tip; do not restore
            # an older catalog and overwrite unrelated hand-verified videos.
            python - <<'PY'
          import json
          from pathlib import Path
          fresh=Path('data/media-domestic-trailers.json')
          updated=Path('/tmp/liangyou-bilibili-covers.json')
          base=json.loads(fresh.read_text())
          covers=json.loads(updated.read_text())
          index={x.get('videoId'): x.get('thumbnail') for x in covers.get('items',[])
                 if x.get('platform')=='bilibili' and x.get('thumbnail')}
          changed=False
          for row in base.get('items',[]):
              bvid=row.get('videoId')
              if row.get('platform')=='bilibili' and bvid in index and row.get('thumbnail')!=index[bvid]:
                  row['thumbnail']=index[bvid]
                  changed=True
          if changed:
              fresh.write_text(json.dumps(base,ensure_ascii=False,indent=2)+'\n')
          PY
            git add data/media-extra-videos.json data/media-domestic-trailers.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh multi-platform film video metadata [skip ci]"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
      - name: Upload independent metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-extra-videos-snapshot
          path: data/media-extra-videos.json
          if-no-files-found: ignore
          retention-days: 3
