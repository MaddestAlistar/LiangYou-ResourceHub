name: Refresh Guardian film news snapshot
on:
  schedule:
    - cron: '40 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_guardian_film.py
      - .github/workflows/refresh-guardian-film.yml
permissions:
  contents: write
concurrency:
  group: guardian-film-news-refresh
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read verified Guardian film articles
        env:
          THE_GUARDIAN_API_KEY: ${{ secrets.THE_GUARDIAN_API_KEY || secrets.GUARDIAN_API_KEY }}
        run: |
          python -m py_compile scripts/update_guardian_film.py
          python scripts/update_guardian_film.py
      - name: Publish updated snapshot only after successful verification
        run: |
          if [ ! -s data/media-guardian.json ]; then
            echo "No new verified Guardian snapshot"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media-guardian.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified Guardian film headlines [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
