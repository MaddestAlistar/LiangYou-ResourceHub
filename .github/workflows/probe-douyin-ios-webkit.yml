name: Diagnose iOS WebKit Douyin video player
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_douyin_ios_webkit.py'
      - '.github/workflows/probe-douyin-ios-webkit.yml'
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Safari WebKit automation dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps webkit
      - name: Test Douyin embeds with phone-sized WebKit engine
        run: python scripts/probe_douyin_ios_webkit.py
