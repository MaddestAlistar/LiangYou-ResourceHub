name: Inspect DOS game keyboard menus
on:
  workflow_dispatch:
  push:
    paths:
      - 'system-lab/test-dos-menu.mjs'
      - '.github/workflows/test-dos-menu.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dos-http.log 2>&1 &
          sleep 2
      - name: Inspect DOS game menu and return
        run: node system-lab/test-dos-menu.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dos-menu-debug
          path: /tmp/dos-*.png
          if-no-files-found: ignore
