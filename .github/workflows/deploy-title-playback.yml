name: Deploy title-specific playback metadata adapter
on:
  push:
    branches: [main]
    paths:
      - labs/title-playback-worker.mjs
      - labs/title-playback-danmaku.mjs
      - scripts/test_media_danmaku.mjs
      - labs/playback-extra-sources.mjs
      - scripts/test_playback_extra_sources.mjs
      - scripts/test_title_playback_worker.mjs
      - .github/workflows/deploy-title-playback.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-liangyou-title-playback
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN || secrets.TMDB_ACCESS_TOKEN || secrets.TMDB_API_TOKEN || secrets.TMDB_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source matching tests and syntax
        run: |
          node --check labs/title-playback-worker.mjs
          node --check labs/title-playback-danmaku.mjs
          node --test scripts/test_media_danmaku.mjs
          node --check labs/playback-extra-sources.mjs
          node --test scripts/test_playback_extra_sources.mjs
          node --test scripts/test_title_playback_worker.mjs
      - name: Check existing Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$TMDB_READ_ACCESS_TOKEN" || test -n "$TMDB_API_KEY"
      - name: Deploy metadata-only Worker (video never proxied)
        run: npx --yes wrangler@4 deploy labs/title-playback-worker.mjs --name liangyou-title-playback --compatibility-date 2026-10-20 --compatibility-flags nodejs_compat
      - name: Install private TMDB credential
        run: |
          if [ -n "$TMDB_READ_ACCESS_TOKEN" ]; then
            printf '%s' "$TMDB_READ_ACCESS_TOKEN" | npx --yes wrangler@4 secret put TMDB_READ_ACCESS_TOKEN --name liangyou-title-playback
          else
            printf '%s' "$TMDB_API_KEY" | npx --yes wrangler@4 secret put TMDB_API_KEY --name liangyou-title-playback
          fi
      - name: Smoke-check new Worker
        run: |
          for n in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "https://liangyou-title-playback.maddestalistar.workers.dev/health" | grep -q '"videoProxy":false'; then
              echo "Playback metadata Worker online; video bytes are not relayed."
              exit 0
            fi
            sleep 4
          done
          exit 1

      - name: Diagnose real title matching without logging video URLs
        run: |
          node --input-type=module <<'NODE'
          const base='https://liangyou-title-playback.maddestalistar.workers.dev';
          const checks=[
            ['TMDB Conan',base+'/api/title/tv/30983?season=1'],
            ['Bangumi Conan',base+'/api/title/work/bangumi-899?kind=tv&title='+encodeURIComponent('名侦探柯南')+
              '&original='+encodeURIComponent('名探偵コナン')+'&year=1996&season=1']
          ];
          for(const [name,url] of checks){
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(32000)});
              const d=await r.json();
              console.log('TITLE_MATCH_SMOKE',JSON.stringify({name,http:r.status,ok:d.ok||false,status:d.status||null,
                workId:d.workId||null,tmdbId:d.tmdbId??null,kind:d.kind||null,
                matchTitle:d.matchedTitle||null,episodes:d.episodes?.length||0,
                sourceFamilies:d.coverage?.sourceFamilies??null,
                extraCandidates:d.coverage?.extraCandidates??null,
                aggregateProbed:d.coverage?.aggregateProbed??null,
                primaryAvailable:d.coverage?.primaryAvailable??null,
                jianpianAvailable:d.coverage?.jianpianAvailable??null,
                aggregateAvailable:d.coverage?.aggregateAvailable??null,
                error:d.error||null}));
            }catch(e){console.log('TITLE_MATCH_SMOKE',JSON.stringify({name,error:String(e?.name||'network_error')}));}
          }
          NODE

      - name: Verify one resolved episode without printing source URLs
        run: |
          node --input-type=module <<'NODE'
          const base='https://liangyou-title-playback.maddestalistar.workers.dev';
          const url=base+'/api/play/work/bangumi-899?kind=tv&title='+encodeURIComponent('名侦探柯南')+
            '&original='+encodeURIComponent('名探偵コナン')+'&year=1996&season=1&episode=1';
          try{
            const r=await fetch(url,{signal:AbortSignal.timeout(55000)});
            const d=await r.json();
            console.log('EPISODE_PLAYBACK_SMOKE',JSON.stringify({
              http:r.status,ok:d.ok||false,status:d.status||null,kind:d.kind||null,
              workId:d.workId||null,season:d.season??null,episode:d.episode??null,
              mediaFormat:d.media?.format||null,mediaCors:d.media?.cors??null,
              isHttps:typeof d.media?.url==='string'&&d.media.url.startsWith('https://'),
              videoProxied:d.videoProxied??null,
              diagnostics:Array.isArray(d.diagnostics)?d.diagnostics.slice(0,12):null}));
          }catch(e){console.log('EPISODE_PLAYBACK_SMOKE',JSON.stringify({error:String(e?.name||'network_error')}));}
          NODE

      - name: Verify small danmaku availability response without transferring comments
        run: |
          node --input-type=module <<'NODE'
          const u=new URL('https://liangyou-title-playback.maddestalistar.workers.dev/api/danmaku/work/tmdb-tv-30984');
          Object.entries({kind:'tv',title:'死神',original:'BLEACH',year:'2004',
            season:'1',episode:'4',check:'1'}).forEach(([k,v])=>u.searchParams.set(k,v));
          const r=await fetch(u,{signal:AbortSignal.timeout(26000)});
          const raw=await r.text();
          const data=JSON.parse(raw);
          const valid=r.ok&&data.ok===true&&data.available===true&&data.count>0&&
            data.workId==='tmdb-tv-30984'&&data.episode===4&&
            !Object.hasOwn(data,'comments')&&raw.length<5000;
          console.log('DANMAKU_AVAILABILITY_SMOKE',JSON.stringify({
            http:r.status,available:data.available??false,
            count:data.count||0,payloadBytes:raw.length,
            containsComments:Object.hasOwn(data,'comments'),valid}));
          if(!valid)process.exitCode=1;
          NODE
      - name: Verify danmaku matching without logging messages
        run: |
          node --input-type=module <<'NODE'
          const p='https://liangyou-title-playback.maddestalistar.workers.dev/api/danmaku/work/tmdb-tv-30984';
          const u=new URL(p);
          Object.entries({kind:'tv',title:'死神',original:'BLEACH',year:'2004',
            season:'1',episode:'4'}).forEach(([k,v])=>u.searchParams.set(k,v));
          try{
            const r=await fetch(u,{signal:AbortSignal.timeout(26000)});
            const d=await r.json();
            console.log('DANMAKU_SMOKE',JSON.stringify({
              http:r.status,status:d.status||null,workId:d.workId||null,
              episode:d.episode||null,count:Number(d.count)||0,
              hasValidTiming:Array.isArray(d.comments)&&d.comments.every(x=>
                Number.isFinite(x.time)&&typeof x.text==='string'),videoProxied:false}));
          }catch(e){
            console.log('DANMAKU_SMOKE',JSON.stringify({error:String(e.name||'network_error')}));
          }
          NODE
