name: Verify and backfill film video thumbnails (isolated)
on:
  push:
    branches: [fix/mobile-acfun-video-thumbnails-20261030]
    paths:
      - .github/workflows/test-film-video-covers.yml
      - scripts/test_media_domestic_trailers.mjs
      - scripts/test_media_extra_videos.py
      - media-insights.js
      - scripts/refresh_media_extra_videos.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JS and source-matching regressions
        run: |
          node --check media-insights.js
          node --test scripts/test_media_domestic_trailers.mjs scripts/test_media_player.mjs scripts/test_media_title_news.mjs
          (cd scripts && python -m unittest -v test_media_extra_videos)
      - name: Backfill public Bilibili video covers
        run: python scripts/enrich_media_domestic_thumbnails.py
      - name: Check actual thumbnails for three platforms
        run: |
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts')
          import refresh_media_extra_videos as m
          movie={'kind':'movie','title':'复仇者联盟5','original':'Avengers: Doomsday',
                 'aliases':['复仇者联盟5','Avengers: Doomsday'],'tmdb_id':1003596,'year':2026}
          tv={'kind':'tv','title':'药屋少女的呢喃','original':'薬屋のひとりごと',
              'aliases':['药屋少女的呢喃','薬屋のひとりごと','The Apothecary Diaries'],
              'tmdb_id':220542,'year':2023}
          for name,fun,work in [('AcFun',m.parse_acfun,tv),('Niconico',m.parse_niconico,tv),('Dailymotion',m.parse_dailymotion,movie)]:
              try:
                  result=fun(work)
                  thumb=[x['thumbnail'] for x in result if x.get('thumbnail')]
                  print('PROVIDER_COVER_RESULT',json.dumps({'platform':name,'count':len(result),'covers':len(thumb),'samples':thumb[:2]},ensure_ascii=False),flush=True)
              except Exception as ex:
                  print('PROVIDER_COVER_UNAVAILABLE',name,type(ex).__name__,str(ex)[:110],flush=True)
          PY
      - name: Commit successfully retrieved public covers on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/media-domestic-trailers.json
          if ! git diff --cached --quiet; then
            git commit -m "Add source-provided Bilibili cover URLs"
            git push origin HEAD:fix/mobile-acfun-video-thumbnails-20261030
          fi
      - name: Upload tested coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-video-thumbnails
          path: data/media-domestic-trailers.json
          retention-days: 3
