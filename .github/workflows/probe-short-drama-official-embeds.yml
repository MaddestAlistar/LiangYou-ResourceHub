name: Probe official short drama iframe playback (read-only)
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_short_drama_official_embeds.mjs
      - .github/workflows/probe-short-drama-official-embeds.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test browsers
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Check real iframe playback in mobile Chromium and WebKit
        run: node scripts/probe_short_drama_official_embeds.mjs
