name: XHS embedded browser playback smoke test
on:
  push:
    paths:
      - '.github/workflows/xhs-video-one-time-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium browser for independent playback check
        run: |
          mkdir -p /tmp/ly-browser
          npm install --no-audit --no-fund --prefix /tmp/ly-browser playwright@1.56.0
          node /tmp/ly-browser/node_modules/playwright/cli.js install chromium
      - name: Load standalone player and test real video decoding
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/local-xhs-server.log 2>&1 &
          node <<'JS'
          const {chromium}=require('/tmp/ly-browser/node_modules/playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--autoplay-policy=no-user-gesture-required']});
            const page=await browser.newPage({viewport:{width:390,height:750},ignoreHTTPSErrors:false});
            page.on('response',res=>{if(res.url().includes('xhscdn.com'))console.log('CDN_RESPONSE',res.status(),res.headers()['content-type']||'',res.url().split('/')[2])});
            page.on('requestfailed',req=>{if(req.url().includes('xhscdn.com'))console.log('CDN_FAILED',req.failure()?.errorText)});
            await page.goto('http://127.0.0.1:8765/xhs-player.html',{waitUntil:'domcontentloaded',timeout:20000});
            await page.locator('video').evaluate(v=>v.play().catch(e=>console.log('Autoplay:',e.name)));
            try{
              await page.waitForFunction(()=>{const v=document.querySelector('video');return v.readyState>=2||v.error!==null},{timeout:45000});
            }catch(e){console.log('WAIT_TIMEOUT',String(e.message).slice(0,150))}
            await page.waitForTimeout(2500);
            const result=await page.locator('video').evaluate(v=>({readyState:v.readyState,networkState:v.networkState,error:v.error?{code:v.error.code,message:v.error.message}:null,width:v.videoWidth,height:v.videoHeight,duration:v.duration,currentTime:v.currentTime,paused:v.paused}));
            console.log('BROWSER_VIDEO_RESULT',JSON.stringify(result));
            await browser.close();
            if(result.error||result.readyState<2||result.width===0)process.exitCode=1;
          })().catch(err=>{console.error('BROWSER_RUN_ERROR',err);process.exitCode=1});
          JS
