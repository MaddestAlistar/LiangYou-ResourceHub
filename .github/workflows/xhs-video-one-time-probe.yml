name: XHS video direct MP4 playback check
on:
  push:
    paths:
      - '.github/workflows/xhs-video-one-time-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check media ranges and anti-hotlink behavior
        shell: bash
        run: |
          set +e
          PATH_MP4='/stream/1/110/258/01ea9907a778280801037001a065d45879_258.mp4'
          for entry in 'backup:https://sns-bak-v10.xhscdn.com' 'source:https://sns-video-zl.xhscdn.com'; do
            key=${entry%%:*}
            base=${entry#*:}
            if [ "$key" = 'source' ]; then
              url="$base$PATH_MP4?sign=46bc6604348d9c0f78cfb165e9d4e683&t=6ae8062a"
            else
              url="$base$PATH_MP4"
            fi
            for mode in no-referrer site-referrer xhs-referrer; do
              case "$mode" in
                no-referrer) ref='' ;;
                site-referrer) ref='https://maddestalistar.github.io/LiangYou-ResourceHub/' ;;
                xhs-referrer) ref='https://www.xiaohongshu.com/' ;;
              esac
              echo "TEST $key $mode"
              curl --location --silent --show-error --max-time 23 --max-filesize 5000000 --range 0-1023 -H "Referer: $ref" -o "/tmp/${key}-${mode}.bin" --write-out 'HTTP=%{http_code} MIME=%{content_type} BYTES=%{size_download} CURL=%{errormsg}\n' "$url"
              if [ -f "/tmp/${key}-${mode}.bin" ]; then
                echo "MAGIC: $(head -c 16 "/tmp/${key}-${mode}.bin" | xxd -p)"
              fi
            done
          done
          echo 'VIDEO_CHECK_DONE'
