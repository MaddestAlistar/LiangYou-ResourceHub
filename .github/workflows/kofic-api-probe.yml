name: Verify KOFIC KOBIS API

on:
  push:
    branches: [main]
    paths: ['.github/workflows/kofic-api-probe.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify box-office API from GitHub runner (keep key private)
        env:
          KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys, json, urllib.request, urllib.parse, urllib.error
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import socket
          key=os.getenv("KOFIC_API_KEY","").strip()
          if not key:
              print("KOFIC_PROBE "+json.dumps({"result":"failed","reason":"missing_secret"}))
              sys.exit(1)
          today=datetime.now(ZoneInfo("Asia/Seoul")).date()
          yesterday=(today-timedelta(days=2)).strftime("%Y%m%d")
          days_since_sunday=(today.weekday()+1)%7
          sunday=(today-timedelta(days=days_since_sunday or 7)).strftime("%Y%m%d")
          endpoints=[
              ("daily","searchDailyBoxOfficeList.json",yesterday,{}),
              ("weekend","searchWeeklyBoxOfficeList.json",sunday,{"weekGb":"1"})
          ]
          hosts=("www.kobis.or.kr","kobis.or.kr")
          connected=False
          for host in hosts:
              try:
                  ips=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  print("KOFIC_NETWORK "+json.dumps({"host":host,"dns":"ok","address_count":len(ips)}))
              except Exception as e:
                  print("KOFIC_NETWORK "+json.dumps({"host":host,"dns":"failed","reason_type":type(e).__name__}))
          results={}
          for host in hosts:
              for name,endpoint,target,extras in endpoints:
                  if name in results: continue
                  url="https://"+host+"/kobisopenapi/webservice/rest/boxoffice/"+endpoint+"?"+urllib.parse.urlencode({"key":key,"targetDt":target,**extras})
                  status=None;body={}
                  network_problem=None
                  try:
                      req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"LiangYouResourceHub/1.0"})
                      with urllib.request.urlopen(req,timeout=14) as response:
                          status=response.status
                          body=json.load(response)
                  except urllib.error.HTTPError as e:
                      status=e.code
                      try: body=json.loads(e.read(8000))
                      except Exception: body={}
                  except urllib.error.URLError as e:
                      network_problem=type(e.reason).__name__
                  except Exception as e:
                      network_problem=type(e).__name__
                  data=body.get("boxOfficeResult",{}) if isinstance(body,dict) else {}
                  field="dailyBoxOfficeList" if name=="daily" else "weeklyBoxOfficeList"
                  rows=data.get(field,[]) if isinstance(data,dict) else []
                  ok=status==200 and isinstance(rows,list) and bool(rows)
                  print("KOFIC_PROBE "+json.dumps({
                      "host":host,"endpoint":name,"target_date":target,"http_status":status,
                      "result":"ok" if ok else "failed","network_error_type":network_problem,
                      "error_response":bool(body.get("faultInfo")) if isinstance(body,dict) else False,
                      "count":len(rows) if isinstance(rows,list) else 0,
                      "sample":[{"rank":r.get("rank"),"movie":r.get("movieNm"),"audience":r.get("audiCnt")} for r in rows[:3] if isinstance(r,dict)]
                  },ensure_ascii=False))
                  if ok:results[name]=True
          sys.exit(0 if len(results)==len(endpoints) else 1)
          PY
