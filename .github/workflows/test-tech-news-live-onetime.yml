name: One-time verify Tech News live API and Pages
on:
  push:
    paths: ['.github/workflows/test-tech-news-live-onetime.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Check module syntax and news data
        run: |
          node --check workers/tech-news.mjs
          node --check tech-news.js
          node --check tech-news-admin.js
      - name: Verify public Worker feed, admin auth and site HTML
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://liangyou-icon-review.maddestalistar.workers.dev';
          const headers={Origin:'https://maddestalistar.github.io'};
          for(const path of ['/health','/news-feed','/news-admin']){
            const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(25000)});
            const data=await r.text();
            console.log('WORKER',path,'HTTP',r.status,'BODY',data.slice(0,400));
            if(path==='/news-feed'){assert.equal(r.status,200);let j=JSON.parse(data);assert.equal(j.schema,1);assert(j.items.length>=3);assert(j.items.some(x=>x.id==='news-carplay-ios272'))}
            else if(path==='/news-admin')assert.equal(r.status,401);
            else assert.equal(r.status,200);
          }
          const site='https://maddestalistar.github.io/LiangYou-ResourceHub/';
          for(const file of ['','icon-review-admin.html','tech-news-admin.js','tech-news.js']){
            const r=await fetch(site+file,{signal:AbortSignal.timeout(22000),headers:{'Cache-Control':'no-cache'}});
            const html=await r.text();
            console.log('PAGE',file||'index','HTTP',r.status,'length',html.length);
            assert.equal(r.status,200);
            if(file==='')assert(html.includes('id="ly-news-list"')&&!html.includes('最新 3 条'));
            if(file==='icon-review-admin.html')assert(html.includes('id="tech-news-admin"')&&html.includes('宣传推广'));
          }
          JS
