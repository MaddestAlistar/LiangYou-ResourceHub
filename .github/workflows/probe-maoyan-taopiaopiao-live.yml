name: Evaluate live Maoyan and Taopiaopiao public source
on:
  push:
    branches: [main]
    paths: ['scripts/probe_maoyan_taopiaopiao_live.py', '.github/workflows/probe-maoyan-taopiaopiao-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test current public HTML for verifiable scoring and box-office fields
        run: python scripts/probe_maoyan_taopiaopiao_live.py
