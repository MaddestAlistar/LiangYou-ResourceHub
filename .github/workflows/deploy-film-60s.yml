name: Deploy isolated film-only 60s API
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-film-60s.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liangyou-film-60s-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check existing Cloudflare deployment credentials
        env:
          CF_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" && test -n "$CF_ACCOUNT" || { echo "::error::Missing Cloudflare secrets"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download pinned 60s MIT source
        shell: bash
        run: |
          git clone --quiet https://github.com/vikiboss/60s.git film-60s
          git -C film-60s checkout --quiet 0b3e95e8fd8c8d961b446bbc2054c0f12c507feb
      - name: Limit Worker to film-related endpoints
        working-directory: film-60s
        shell: bash
        run: |
          cat > liangyou-film-worker.ts <<'EOF'
          import { app } from './src/app.ts'
          // Deliberate public allowlist: do not expose the full generic utility API.
          const allowed = new Set([
            '/v2/douban/weekly/movie',
            '/v2/douban/weekly/tv_chinese',
            '/v2/douban/weekly/tv_global',
            '/v2/douban/weekly/show_chinese',
            '/v2/douban/weekly/show_global',
            '/v2/maoyan/realtime/movie',
            '/v2/maoyan/all/movie',
            '/v2/maoyan/realtime/web',
            '/v2/maoyan/realtime/tv',
            '/v2/baidu/teleplay',
          ])
          export default {
            fetch(request: Request, env: unknown, ctx: ExecutionContext) {
              const pathname = new URL(request.url).pathname
              if (request.method !== 'GET' || !allowed.has(pathname)) {
                return new Response(JSON.stringify({code:404,message:'Not Found'}),{
                  status:404, headers:{'Content-Type':'application/json','Access-Control-Allow-Origin':'*'}
                })
              }
              return app.fetch(request, env, ctx)
            },
          }
          EOF
      - name: Install dependencies and deploy as separate Worker
        working-directory: film-60s
        env:
          CLOUDFLARE_API_TOKEN: \${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: \${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx wrangler@4 deploy --name liangyou-film-60s --main liangyou-film-worker.ts --config wrangler.toml
