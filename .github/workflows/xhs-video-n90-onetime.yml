name: Verify N90 HTTPS video and cover
on:
  push:
    paths:
      - '.github/workflows/xhs-video-n90-onetime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify media under HTTPS and cross-site referrer
        run: |
          set +e
          U='https://sns-bak-v10.xhscdn.com/stream/1/110/258/01eaa4e9a60a2e6c01037001a09437ef94_258.mp4'
          for MODE in none site; do
            REF=''
            if [ "$MODE" = site ]; then REF='https://maddestalistar.github.io/LiangYou-ResourceHub/'; fi
            echo "TEST_VIDEO $MODE"
            curl -sS --location --max-time 28 --range 0-1023 -H "Referer: $REF" -o /tmp/n90-byte.bin -w 'VIDEO_HTTP=%{http_code} MIME=%{content_type} BYTES=%{size_download} EFFECTIVE=%{url_effective}\n' "$U"
            echo "VIDEO_MAGIC=$(head -c 16 /tmp/n90-byte.bin | xxd -p)"
          done
          echo TEST_COVER
          curl -sS --location --max-time 20 --range 0-511 -H 'Referer:' -o /tmp/n90-cover.bin -w 'COVER_HTTP=%{http_code} MIME=%{content_type} BYTES=%{size_download}\n' 'https://ci.xiaohongshu.com/1040g2sg3250nkp463ce049g0m2ors2l14jgc7rg?imageView2/format/jpeg'
