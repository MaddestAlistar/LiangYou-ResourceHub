name: Refresh current worldwide theatrical chart snapshot
on:
  schedule:
    - cron: '18 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_media_worldwide_current.py'
      - '.github/workflows/refresh-media-worldwide-current.yml'
permissions:
  contents: write
concurrency:
  group: worldwide-current-boxoffice-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight table parser
        run: python -m pip install 'beautifulsoup4>=4.12,<5'
      - name: Read and validate current cited worldwide chart
        run: |
          python -m py_compile scripts/update_media_worldwide_current.py
          python scripts/update_media_worldwide_current.py
      - name: Commit only accepted snapshot
        run: |
          if [ ! -s data/media-worldwide-current.json ]; then
            echo "No verified current chart, historical chart remains available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media-worldwide-current.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh community-sourced worldwide theatrical chart [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
