name: Verify Wikidata Apple iTunes Wikipedia APIs

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-wikidata-itunes-wikipedia.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-apis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check three public film-data APIs without keys
        run: |
          python - <<'PY'
          import json, sys, urllib.parse, urllib.request, urllib.error
          UA='LiangYouResourceHub-API-Verification/1.0 (read-only; GitHub Actions)'
          def query(url,params=None):
              if params: url+='?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=18) as f:
                      return f.status,json.load(f),None
              except urllib.error.HTTPError as e:
                  return e.code,{},'HTTPError'
              except Exception as e:
                  return None,{},type(e).__name__
          results={}
          code,body,err=query('https://www.wikidata.org/w/api.php',{
              'action':'wbgetentities','ids':'Q42','props':'labels|descriptions','languages':'en|zh','format':'json'
          })
          entry=body.get('entities',{}).get('Q42',{}) if isinstance(body,dict) else {}
          ok=code==200 and entry.get('id')=='Q42' and bool(entry.get('labels',{}))
          results['Wikidata API']={'http':code,'result':'PASS' if ok else 'FAIL','entity_id':entry.get('id'),
              'label_en':entry.get('labels',{}).get('en',{}).get('value'),
              'label_zh':entry.get('labels',{}).get('zh',{}).get('value'),'error_type':err}
          code,body,err=query('https://itunes.apple.com/search',{
              'term':'Inception','media':'movie','entity':'movie','country':'us','limit':'5'
          })
          rows=body.get('results',[]) if isinstance(body,dict) else []
          ok=code==200 and isinstance(rows,list) and len(rows)>0 and body.get('resultCount',0)>0
          results['Apple iTunes Search API']={'http':code,'result':'PASS' if ok else 'FAIL',
              'result_count':body.get('resultCount') if isinstance(body,dict) else None,
              'first_title':rows[0].get('trackName') if rows else None,
              'has_store_link':bool(rows and rows[0].get('trackViewUrl')),'error_type':err}
          code,body,err=query('https://en.wikipedia.org/w/api.php',{
              'action':'query','format':'json','prop':'info','titles':'Inception','redirects':'1'
          })
          pages=body.get('query',{}).get('pages',{}) if isinstance(body,dict) else {}
          valid=[v for v in pages.values() if isinstance(v,dict) and v.get('pageid') and not v.get('missing')]
          ok=code==200 and bool(valid)
          results['Wikipedia API']={'http':code,'result':'PASS' if ok else 'FAIL',
              'page_id':valid[0].get('pageid') if valid else None,
              'page_title':valid[0].get('title') if valid else None,'error_type':err}
          for name,item in results.items():
              print('PUBLIC_FILM_API_PROBE '+json.dumps({'api':name,**item},ensure_ascii=False),flush=True)
          print('PUBLIC_FILM_API_SUMMARY '+json.dumps({'passed':sum(x['result']=='PASS' for x in results.values()),
              'total':len(results)}),flush=True)
          sys.exit(0 if all(x['result']=='PASS' for x in results.values()) else 1)
          PY
