name: Deploy independent JustWatch availability adapter
on:
  push:
    branches: [main]
    paths:
      - labs/streaming-availability-worker.mjs
      - .github/workflows/deploy-streaming-availability.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-liangyou-streaming-availability
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN || secrets.TMDB_ACCESS_TOKEN || secrets.TMDB_API_TOKEN || secrets.TMDB_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      KOFIC_API_KEY: ${{ secrets.KOFIC_API_KEY }}
      FANARTTV_API_KEY: ${{ secrets.FANARTTV_API_KEY || secrets.FANART_TV_API_KEY }}
      THETVDB_API_KEY: ${{ secrets.THETVDB_API_KEY || secrets.TVDB_API_KEY }}
      THETVDB_PIN: ${{ secrets.THETVDB_PIN || secrets.TVDB_PIN }}
      THE_GUARDIAN_API_KEY: ${{ secrets.THE_GUARDIAN_API_KEY || secrets.GUARDIAN_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY || secrets.YOUTUBE_DATA_API_KEY || secrets.YOUTUBE_DATA_API_V3_KEY }}
      TASTEDIVE_API_KEY: ${{ secrets.TASTEDIVE_API_KEY }}
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID || secrets.MYANIMELIST_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax
        run: node --check labs/streaming-availability-worker.mjs
      - name: Deploy Worker
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy labs/streaming-availability-worker.mjs --name liangyou-streaming-availability --compatibility-date 2025-11-05
      - name: Configure private TMDB bearer on Worker
        if: env.TMDB_READ_ACCESS_TOKEN != ''
        run: printf '%s' "$TMDB_READ_ACCESS_TOKEN" | npx --yes wrangler@4 secret put TMDB_READ_ACCESS_TOKEN --name liangyou-streaming-availability
      - name: Configure private TMDB API key on Worker
        if: env.TMDB_READ_ACCESS_TOKEN == '' && env.TMDB_API_KEY != ''
        run: printf '%s' "$TMDB_API_KEY" | npx --yes wrangler@4 secret put TMDB_API_KEY --name liangyou-streaming-availability
      - name: Configure optional media insight secrets
        run: |
          for name in OMDB_API_KEY KOFIC_API_KEY FANARTTV_API_KEY THETVDB_API_KEY THETVDB_PIN THE_GUARDIAN_API_KEY YOUTUBE_API_KEY TASTEDIVE_API_KEY MAL_CLIENT_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@4 secret put "$name" --name liangyou-streaming-availability
            fi
          done
      - name: Verify at least one credential configured
        run: test -n "$TMDB_READ_ACCESS_TOKEN" || test -n "$TMDB_API_KEY"
      - name: Audit live news for movies without manually curated articles
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const examples=[
            {id:27205,title:'Inception (2010)'},
            {id:603,title:'The Matrix (1999)'},
            {id:129,title:'Spirited Away (2001)'},
            {id:157336,title:'Interstellar (2014)'}
          ];
          const base='https://liangyou-streaming-availability.maddestalistar.workers.dev/api/news/title/movie/';
          const results=await Promise.all(examples.map(async x=>{
            try{
              const response=await fetch(base+x.id+'?audit='+encodeURIComponent(process.env.GITHUB_SHA||'unknown'),{signal:AbortSignal.timeout(40000)});
              const json=await response.json();
              return {title:x.title,status:json.status||'unknown',diagnostics:json.sourceDiagnostics||null,count:json.articles?.length||0,
                chinese:(json.articles||[]).filter(v=>v.language==='zh').length,
                international:(json.articles||[]).filter(v=>v.language!=='zh').length,
                sourceCounts:Object.fromEntries([...new Set((json.articles||[]).map(v=>v.source))].map(name=>
                  [name,json.articles.filter(v=>v.source===name).length]))};
            }catch(error){return {title:x.title,status:'network_error',error:String(error).slice(0,120),count:0};}
          }));
          console.log('FILM_NEWS_LIVE_COVERAGE',JSON.stringify(results));
          if(results.every(v=>v.count===0))console.log('::warning::All sampled uncurated films had zero live news results; check provider access and query matching');
          // Video metadata uses the same film ID; search errors are distinct
          // from having zero verified clips. No login or session required.
          const videoResults=await Promise.all(examples.map(async x=>{
            try{
              const uri='https://liangyou-streaming-availability.maddestalistar.workers.dev/api/videos/title/movie/'+x.id+'?audit='+encodeURIComponent(process.env.GITHUB_SHA||'unknown');
              const r=await fetch(uri,{signal:AbortSignal.timeout(23000)});
              const d=await r.json();
              return {title:x.title,status:d.status||'unknown',verifiedBilibiliVideos:d.videos?.length||0,
                source:d.source||'unknown'};
            }catch(error){return {title:x.title,status:'network_error',verifiedBilibiliVideos:0,
              error:String(error).slice(0,100)};}
          }));
          console.log('FILM_VIDEO_LIVE_COVERAGE',JSON.stringify(videoResults));
          NODE
