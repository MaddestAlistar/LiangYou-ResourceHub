name: Verify dynamic Bilibili cover image relay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-media-video-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check real Bilibili thumbnail through published Worker
        run: |
          node --input-type=module <<'NODE'
          const original='https://i1.hdslb.com/bfs/archive/3bb32693eb30498f4510c53716b11fcb6aab30bf.jpg';
          const base='https://liangyou-streaming-availability.maddestalistar.workers.dev';
          const response=await fetch(base+'/api/media-cover/bilibili?src='+encodeURIComponent(original),{
            headers:{Origin:'https://maddestalistar.github.io'},signal:AbortSignal.timeout(20000)
          });
          const mime=(response.headers.get('content-type')||'').split(';')[0];
          const data=new Uint8Array(await response.arrayBuffer());
          const image=mime==='image/jpeg'&&data.length>500&&data[0]===255&&data[1]===216&&data[2]===255;
          console.log('BILIBILI_RELAY_LIVE',JSON.stringify({
            http:response.status,type:mime,bytes:data.length,validJpeg:image,
            cors:response.headers.get('access-control-allow-origin')
          }));
          if(!response.ok||!image)process.exitCode=1;
          NODE
