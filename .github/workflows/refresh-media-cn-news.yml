name: Refresh Chinese and international film news headlines
on:
  schedule:
    - cron: '45 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_media_cn_news.py'
      - 'scripts/update_media_world_news.py'
      - '.github/workflows/refresh-media-cn-news.yml'
permissions:
  contents: write
concurrency:
  group: media-cn-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch attributed Chinese film headlines
        run: |
          python -m py_compile scripts/update_media_cn_news.py
          python scripts/update_media_cn_news.py
          python -m py_compile scripts/update_media_world_news.py
          python scripts/update_media_world_news.py
      - name: Publish only validated updates
        run: |
          if [ ! -s data/media-cn-news.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media-cn-news.json
          if [ -e data/media-world-news.json ]; then git add data/media-world-news.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update verified mainland film headlines [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
