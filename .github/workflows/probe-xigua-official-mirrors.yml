name: Probe official Xigua Toutiao Douyin mirror URLs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_xigua_official_mirrors.py'
      - '.github/workflows/probe-xigua-official-mirrors.yml'
permissions:
  contents: read
jobs:
  mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_xigua_official_mirrors.py
