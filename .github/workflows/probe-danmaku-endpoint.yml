name: Probe external danmaku API manually
on:
  push:
    branches: [main]
    paths:
      - scripts/probe_danmaku_endpoint.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe danmaku search, match and comments without exposing comment texts
        run: node scripts/probe_danmaku_endpoint.mjs
