name: Probe AcFun inline playback compatibility
on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_acfun_embeds.py'
      - '.github/workflows/probe-acfun-embeds.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public iframe headers and HTML5 metadata (no media downloads)
        run: python scripts/probe_acfun_embeds.py
