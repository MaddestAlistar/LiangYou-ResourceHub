name: Cache verified animated film video previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cache_media_bilibili_animated_previews.py'
      - '.github/workflows/cache-media-animated-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: media-film-animated-previews-main
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebP image writer
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate public videoshot previews for verified Bilibili IDs
        run: |
          python -m py_compile scripts/cache_media_bilibili_animated_previews.py
          python scripts/cache_media_bilibili_animated_previews.py
      - name: Validate WebP previews and catalog paths
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          from PIL import Image
          data=json.loads(Path('data/media-domestic-trailers.json').read_text())
          for item in data['items']:
              u=item.get('animatedThumbnailLocal')
              if u:
                  assert re.fullmatch(r'\./assets/media-video-previews/BV[A-Za-z0-9]{10}\.webp',u)
                  im=Image.open(u)
                  assert im.format=='WEBP' and im.n_frames>=3
          PY
      - name: Commit confirmed animated thumbnails
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/media-domestic-trailers.json assets/media-video-previews/
          if git diff --cached --quiet; then echo 'No new animated video previews'; exit 0; fi
          git commit -m "Cache animated Bilibili storyboard previews [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
