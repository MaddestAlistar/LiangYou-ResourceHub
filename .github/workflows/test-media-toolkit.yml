name: Test streaming and media toolkit integration
on:
  push:
    branches: [main]
    paths:
      - index.html
      - media-intel.js
      - media-intel.css
      - media-insights.js
      - media-cn-enhance.js
      - media-cn-enhance.css
      - data/media-cn-news.json
      - scripts/update_media_cn_news.py
      - media-toolkit.js
      - media-title-playback.js
      - media-title-playback.css
      - labs/title-playback-worker.mjs
      - labs/title-playback-danmaku.mjs
      - media-title-danmaku.js
      - media-title-danmaku.css
      - scripts/test_media_danmaku.mjs
      - scripts/test_media_danmaku_ui.mjs
      - labs/playback-extra-sources.mjs
      - scripts/test_playback_extra_sources.mjs
      - scripts/test_title_playback_worker.mjs
      - scripts/test_media_playback_click.mjs
      - china-perf.js
      - media-toolkit.css
      - labs/streaming-availability-worker.mjs
      - scripts/test_media_insights.mjs
      - .github/workflows/test-media-toolkit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify offline film-insights contracts
        run: |
          node --test scripts/test_media_insights.mjs
          node --test scripts/test_title_playback_worker.mjs
          node --test scripts/test_media_danmaku.mjs
          node --test scripts/test_media_danmaku_ui.mjs
          node --test scripts/test_playback_extra_sources.mjs
          node --test scripts/test_media_playback_click.mjs
      - name: Validate JavaScript syntax and no public credentials
        run: |
          node --check media-intel.js
          node --check media-insights.js
          node --check media-cn-enhance.js
          python -m py_compile scripts/update_media_cn_news.py
          node --check media-toolkit.js
          node --check media-title-playback.js
          node --check media-title-danmaku.js
          node --check labs/title-playback-danmaku.mjs
          node --check labs/title-playback-worker.mjs
          node --check labs/playback-extra-sources.mjs
          node --check labs/streaming-availability-worker.mjs
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()+Path("china-perf.js").read_text()
          base=Path("media-intel.js").read_text()
          toolkit=Path("media-toolkit.js").read_text()
          worker=Path("labs/streaming-availability-worker.mjs").read_text()
          assert html.count('./media-toolkit.js?')==1
          assert html.count('./media-toolkit.css?')==1
          assert html.count('./media-title-playback.js?')==1
          assert html.count('./media-title-playback.css?')==1
          playback=Path('media-title-playback.js').read_text()
          assert 'liangyou:media-detail' in playback and 'mtk-playback' in playback
          assert 'api/play/' in Path('labs/title-playback-worker.mjs').read_text() or 'mode===\"title\"' in Path('labs/title-playback-worker.mjs').read_text()
          assert 'videoProxied:false' in Path('labs/title-playback-worker.mjs').read_text()
          assert "liangyou:media-detail" in base and "liangyou:media-detail" in toolkit
          assert "media-insights.js" in html
          assert 'media-cn-enhance.js' in html and 'media-cn-enhance.css' in html
          assert 'mi-cn-auto' in Path('media-cn-enhance.js').read_text()
          assert 'mi-source-registry' not in Path('media-insights.js').read_text()
          assert "mi-trailer-trigger" in Path("media-insights.js").read_text()
          assert "mi-grid .mi-card-copy" in Path("media-intel.css").read_text()
          assert "data-mi-status" in base and "LiangYouWatchlist" in toolkit
          assert "data-mtk-export" in toolkit and "tmdbID,imdbID,Title,Year" in toolkit
          assert "JustWatch via TMDB" in worker and "TMDB_READ_ACCESS_TOKEN" in worker
          assert "Authorization" in worker and "api_key" in worker
          assert "movieclaw.io/en/docs/overview" in toolkit
          assert "letterboxd.com/search/films/" in toolkit
          assert "sofatime.app" not in toolkit.lower() or True
          print("MEDIA_TOOLKIT_STATIC_OK")
          PY
