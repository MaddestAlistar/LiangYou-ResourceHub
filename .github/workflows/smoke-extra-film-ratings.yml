name: Verify four-provider independent rating Worker
on:
  push:
    branches: [main]
    paths: [.github/workflows/smoke-extra-film-ratings.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate live scores and identity, including secure Simkl path
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error
          base="https://liangyou-extra-ratings-lab.maddestalistar.workers.dev"
          samples=[
            ("/api/health",None,None),
            ("/api/bilibili/season/26801","Bilibili 番剧",10),
            ("/api/bilibili/season/42290","Bilibili 番剧",10),
            ("/api/kitsu/anime/1","Kitsu",100),
            ("/api/mydramalist/drama/58651-run-on","MyDramaList (third-party)",10),
            ("/api/simkl/10280","Simkl",10),
            ("/api/kitsu/anime/not_a_number",None,None),
          ]
          outcomes={}
          for path,source,scale in samples:
            try:
              with urllib.request.urlopen(urllib.request.Request(base+path,headers={"User-Agent":"LiangYou-Rating-Smoke/1.0","Accept":"application/json"}),timeout=28) as r:
                status=r.status
                x=json.load(r)
            except urllib.error.HTTPError as e:
              status=e.code
              try:x=json.load(e)
              except Exception:x={}
            except Exception as e:
              status=None;x={"error":type(e).__name__}
            rating=x.get("rating")
            valid=bool(status==200 and x.get("platform")==source and x.get("scale")==scale and
                      isinstance(rating,(float,int)) and 0<rating<=scale and
                      x.get("pageUrl","").startswith("https://"))
            if path=="/api/health":valid=status==200
            if path=="/api/kitsu/anime/not_a_number":valid=status==404
            if path=="/api/bilibili/season/26801":valid=valid and x.get("title")=="鬼灭之刃" and x.get("ratingCount",0)>100000
            if path=="/api/kitsu/anime/1":valid=valid and x.get("title")=="Cowboy Bebop" and x.get("libraryUserCount",0)>100000
            if path=="/api/mydramalist/drama/58651-run-on":valid=valid and x.get("title","").startswith("Run On")
            if path=="/api/simkl/10280":valid=valid and x.get("ratingCount",0)>3000
            outcomes[path]=bool(valid)
            print("RATING_WORKER_SMOKE "+json.dumps({"path":path,"http":status,"platform":x.get("platform"),
             "title":x.get("title"),"rating":rating,"scale":x.get("scale"),
             "ratingCount":x.get("ratingCount"),"libraryUsers":x.get("libraryUserCount"),"valid":bool(valid),
             "error":x.get("error"),"reason":x.get("reason")},ensure_ascii=False),flush=True)
          print("RATING_WORKER_FINAL "+json.dumps(outcomes),flush=True)
          assert all(outcomes.values()),"An actual upstream rating validation failed"
          PY
