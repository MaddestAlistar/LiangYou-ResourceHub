name: Refresh verified MyAnimeList anime snapshot
on:
  schedule:
    - cron: '50 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_mal_snapshot.py'
      - '.github/workflows/refresh-mal-anime.yml'
permissions:
  contents: write
concurrency:
  group: mal-anime-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect only titles with an exact known MAL identifier
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID || secrets.MYANIMELIST_CLIENT_ID }}
        run: |
          python -m py_compile scripts/refresh_mal_snapshot.py
          python scripts/refresh_mal_snapshot.py
      - name: Commit verified data only
        run: |
          if [ ! -s data/media-mal-v2.json ]; then
            echo "No verified anime metadata available"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media-mal-v2.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified MAL anime details [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
