name: Test WebKit iPhone-like OS startup
on:
  push:
    branches: [main]
    paths:
      - 'system-lab/**'
      - '.github/workflows/test-system-lab-webkit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install WebKit runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps webkit
      - name: Serve static site
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/os-webkit-server.log 2>&1 &
          sleep 2
      - name: Boot FreeDOS on mobile WebKit
        run: node system-lab/test-webkit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: os-lab-webkit-screenshots
          path: /tmp/ly-os-webkit*.png
          if-no-files-found: ignore
