name: Optimize oversized Icon Library preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-icon-preview.yml'
      - 'scripts/optimize_icon_preview.py'
      - 'assets/previews/icons-komic.png'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: liangyou-icon-preview-optimization
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image optimizer
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate verified local WebP
        run: python scripts/optimize_icon_preview.py
      - name: Commit preview with concurrent-update protection
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/previews/icons-komic.webp data/projects.json
          if ! git diff --cached --quiet; then
            git commit -m "perf: use lightweight local Komic preview [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
          fi
      - name: Publish updated gallery to branch-based Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_pages.py
