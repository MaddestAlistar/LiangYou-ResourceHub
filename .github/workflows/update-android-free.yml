name: Refresh Android free deals

on:
  schedule:
    # Beijing time: every three hours, with a fallback attempt in case GitHub drops a cron event.
    # Scheduled GitHub Actions can be delayed and are not an exact-time guarantee.
    - cron: '21 2,5,8,11,14,17,20,23 * * *'
    - cron: '51 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-android-free.yml'
      - 'scripts/update_android_free.py'

permissions:
  contents: write

concurrency:
  group: android-free-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source HTML parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Check public Google Play free-deal listings
        run: python scripts/update_android_free.py
      - name: Publish JSON and locally cached app icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/android-free.json assets/android-free
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Android paid-to-free deals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
