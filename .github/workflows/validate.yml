name: Validate resource hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check design.js
          node --check daily-free.js
          node --check sports-i18n.js
          node --check sports.js
          python3 -m py_compile scripts/*.py
      - name: Verify icon publisher regressions
        run: node --test scripts/test_icon*.mjs
      - name: Install feed parsers
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4 pillow
      - name: Verify source filtering regressions
        run: python3 -m unittest discover -s scripts -p 'test_feeds.py'
      - name: Verify Chinese and English sports translations
        run: node scripts/test_sports_i18n.mjs
      - name: Validate catalog and web structure
        run: node scripts/validate.mjs
