name: Validate resource hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check design.js
          node --check daily-free.js
          node --check sports-i18n.js
          node --check sports.js
          python3 -m py_compile scripts/update_sports.py
      - name: Verify Chinese and English sports translations
        run: node scripts/test_sports_i18n.mjs
      - name: Validate catalog and web structure
        run: node scripts/validate.mjs
