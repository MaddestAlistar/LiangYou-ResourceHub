name: Check expanded OS sample assets
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-os-lab-expanded-images.yml'
      - 'system-lab/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ReactOS and Android-x86 sample chunk origins
        shell: bash
        run: |
          set -uo pipefail
          for item in \
            'reactos|https://i.copy.sh/reactos-v3/0-1048576.img' \
            'android|https://i.copy.sh/android-x86-1.6-r2/0-1048576.iso' \
            'android4|https://i.copy.sh/android_x86_nonsse3_4.4r1_20140904/0-1048576.iso'; do
            name="${item%%|*}"; url="${item#*|}"
            echo "::group::$name $url"
            headers="$(mktemp)"
            http="$(curl -sSL --connect-timeout 8 --max-time 22 -H 'Origin: https://maddestalistar.github.io' -o /dev/null -D "$headers" -w '%{http_code}' "$url" || true)"
            echo "HTTP=$http"
            if [[ "$http" != "200" ]]; then echo "::error::$name image chunk not available"; exit 1; fi
            if ! grep -qiE '^access-control-allow-origin: (\\*|https://maddestalistar.github.io)' "$headers"; then
              echo "::error::$name image chunk lacks CORS"; exit 1
            fi
            grep -iE '^HTTP/|^access-control-allow-origin:|^content-type:|^content-length:' "$headers" || true
            rm -f "$headers"
            echo "::endgroup::"
          done
          echo "::group::ReactOS optional state snapshot"
          curl -sSLI --connect-timeout 8 --max-time 20 \
            -H 'Origin: https://maddestalistar.github.io' \
            'https://i.copy.sh/reactos_state-v3.bin.zst' | grep -iE '^HTTP/|^content-length:|^access-control-allow-origin:' || true
          echo "::endgroup::"
