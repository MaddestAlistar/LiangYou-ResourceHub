name: Refresh verified App Store daily free

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-daily-free.yml'
      - 'scripts/update_daily_free.py'

permissions:
  contents: write

concurrency:
  group: daily-free-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public RSS and verify zero prices with Apple
        run: python scripts/update_daily_free.py
      - name: Commit verified snapshot and locally cached icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/daily-free.json assets/daily-free
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified daily-free App Store deals [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
