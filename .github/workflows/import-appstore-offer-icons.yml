name: Import official App Store benefit icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-appstore-offer-icons.yml'
      - 'scripts/fetch_appstore_offer_icons.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon optimizer
        run: python -m pip install --disable-pip-version-check "pillow>=10,<13"
      - name: Download eight verified App Store artworks
        run: python scripts/fetch_appstore_offer_icons.py
      - name: Commit optimized local artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/offer-icons/*.webp assets/offer-icons/appstore-sources.json
          if ! git diff --cached --quiet; then
            git commit -m "Import eight official App Store artwork icons for benefits"
            git push origin HEAD:main
          fi
