name: Refresh officially playable Douyin media videos
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-media-douyin-videos.yml'
      - 'scripts/refresh_media_douyin_videos.py'
      - 'scripts/test_media_douyin_videos.py'
      - 'scripts/merge_media_douyin.py'
permissions:
  contents: write
concurrency:
  group: media-douyin-discovery-main
  cancel-in-progress: false
jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test identity matching and official embed approval
        run: |
          python -m py_compile scripts/refresh_media_douyin_videos.py scripts/merge_media_douyin.py
          (cd scripts && python -m unittest -v test_media_douyin_videos)
          node --check media-insights.js
          node --test scripts/test_media_domestic_trailers.mjs
      - name: Discover public index matches and validate each via Douyin official API
        run: python scripts/refresh_media_douyin_videos.py
      - name: Reject invalid videos or oversized snapshots
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          path=Path('data/media-douyin-verified.json')
          d=json.loads(path.read_text())
          assert d['schema']==1 and isinstance(d['items'],dict)
          assert path.stat().st_size < 450000
          for k,item in d['items'].items():
              assert isinstance(item.get('videos'),list)
              assert len(item['videos'])<=4
              for v in item['videos']:
                  vid=str(v['videoId'])
                  assert re.fullmatch(r'[1-9]\d{14,20}',vid)
                  assert v['platform']=='douyin'
                  assert v['embedVerified'] is True and v['verifiedByOfficialDouyin'] is True
                  assert v['embedId']==vid
                  assert v['verifiedSource']=='https://jingxuan.douyin.com/m/video/'+vid
                  assert v['kind']==item['kind']
                  if v['kind']=='anime':
                      assert v['workId']==item['workId'] and v['verifiedByCatalogTitle'] is True
                  else:
                      assert v['tmdbId']==item['tmdbId'] and v['matchedByTitle'] is True
          print('DOUYIN_SNAPSHOT_VALIDATED',len(d['items']))
          PY
      - name: Save discovered playable videos without rolling back other project updates
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/media-douyin-verified.json /tmp/liangyou-douyin-verified.json
          BRANCH="$GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            python scripts/merge_media_douyin.py data/media-douyin-verified.json /tmp/liangyou-douyin-verified.json
            git add data/media-douyin-verified.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh approved Douyin film/anime trailers [skip ci]"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
