name: Verify Predict.fun feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-predict.yml'
      - 'scripts/update_predict_sports.py'
      - 'scripts/test_feeds.py'

permissions:
  contents: read

concurrency:
  group: verify-predict-feed
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install feed test dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 pillow
      - name: Validate Predict market parsing without credentials
        run: python -m unittest discover -s scripts -p 'test_feeds.py'
      - name: Collect real read-only Predict markets
        env:
          PREDICT_FUN_API_TOKEN: ${{ secrets.PREDICT_FUN_API_TOKEN }}
        run: python -u scripts/update_predict_sports.py
      - name: Validate fetched snapshot without publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/predict-sports.json').read_text())
          assert data['schema']==1 and data['source_type']=='prediction_market'
          assert data['status']=='ok' and isinstance(data['events'],list)
          print('Verified Predict events:', len(data['events']))
          PY
