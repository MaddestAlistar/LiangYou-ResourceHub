name: Probe Apple TV Feed movies latest

on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-apple-tv-feed.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check official Apple TV Feed without partner authorization
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, socket
          host='api-feeds.tv.apple.com'
          try:
              infos=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
              print('APPLE_TV_FEED_DNS '+json.dumps({'host':host,'result':'ok','records':len(infos)}))
          except Exception as exc:
              print('APPLE_TV_FEED_DNS '+json.dumps({'host':host,'result':'failed','issue_type':type(exc).__name__}))
          url='https://api-feeds.tv.apple.com/v1/feed/movies/latest'
          req=urllib.request.Request(url,headers={'User-Agent':'LiangYouResourceHub/1.0','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=20) as response:
                  code=response.status
                  content_type=response.headers.get('Content-Type','')
                  raw=response.read(10000)
          except urllib.error.HTTPError as exc:
              code=exc.code
              content_type=exc.headers.get('Content-Type','')
              raw=exc.read(10000)
          except Exception as exc:
              print('APPLE_TV_FEED_PROBE '+json.dumps({'result':'connection_failed','http_status':None,'issue_type':type(exc).__name__}))
              raise SystemExit(0)
          try: parsed=json.loads(raw)
          except Exception: parsed={}
          entries=parsed.get('data',[]) if isinstance(parsed,dict) else []
          errors=parsed.get('errors',[]) if isinstance(parsed,dict) else []
          first=entries[0] if isinstance(entries,list) and entries else {}
          print('APPLE_TV_FEED_PROBE '+json.dumps({
              'result':'available' if code==200 and len(entries)>0 else 'authorization_required' if code in (401,403) else 'no_data',
              'http_status':code,'content_type':content_type.split(';')[0],
              'data_items':len(entries) if isinstance(entries,list) else None,
              'export_id':first.get('id') if isinstance(first,dict) else None,
              'error_codes':[str(e.get('code'))[:80] for e in errors[:3] if isinstance(e,dict)] if isinstance(errors,list) else [],
              'response_keys':list(parsed.keys())[:8] if isinstance(parsed,dict) else []
          },ensure_ascii=False))
          PY
