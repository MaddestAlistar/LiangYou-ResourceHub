name: Probe official Douyin iframe compatibility for Xigua
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_xigua_douyin.py'
      - '.github/workflows/probe-xigua-douyin.yml'
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Xigua public IDs against documented official Douyin embed API
        run: python scripts/probe_xigua_douyin.py
