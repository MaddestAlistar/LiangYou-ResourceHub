name: Probe Xigua real website iframe playback
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_xigua_iframe.py'
      - '.github/workflows/probe-xigua-iframe.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only browser automation support
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: Check real Xigua iframe and mobile embed from Pages
        run: python scripts/probe_xigua_iframe.py
