name: Verify supplemental sports API access
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nba-api-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Probe configured providers without logging credentials
        env:
          DUNKAPI_API_KEY: ${{ secrets.DUNKAPI_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse
          def request(name,url,key,header,body=None):
              if not key:print(name,'MISSING_SECRET',flush=True);return
              headers={header:key,'Accept':'application/json','User-Agent':'LiangYou-ResourceHub/1.0'}
              if body is not None:headers['Content-Type']='application/json'
              req=urllib.request.Request(url,headers=headers,data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      status=r.status; payload=json.load(r)
              except urllib.error.HTTPError as e:
                  status=e.code
                  try:payload=json.loads(e.read(32768).decode())
                  except Exception:payload={}
              except Exception as e:
                  print(name,'NETWORK_ERROR',type(e).__name__,flush=True);return
              if not isinstance(payload,dict):
                  print(name,'INVALID_JSON',status,flush=True);return
              output={'probe':name,'status':status,'keys':list(payload)[:18]}
              if name=='dunk_nba':
                  rows=payload.get('standings',[])
                  output.update({'season':payload.get('season'),'count':len(rows) if isinstance(rows,list) else None,'sample':rows[:1] if isinstance(rows,list) else None,'error':str(payload.get('error',''))[:150]})
              elif name=='football_competitions':
                  rows=payload.get('competitions',[])
                  output.update({'count':len(rows) if isinstance(rows,list) else None,'codes':[x.get('code') for x in rows if isinstance(x,dict)][:30]})
              elif name=='football_matches':
                  rows=payload.get('matches',[])
                  output.update({'count':len(rows) if isinstance(rows,list) else None,'leagues':sorted(set(str(x.get('competition',{}).get('code','')) for x in rows if isinstance(x,dict))),'sample':[{'date':x.get('utcDate'),'status':x.get('status'),'league':x.get('competition',{}).get('code')} for x in rows[:3]] if isinstance(rows,list) else None})
              elif name=='football_pl_standings':
                  rows=payload.get('standings',[])
                  output.update({'groups':len(rows) if isinstance(rows,list) else None,'teams':sum(len(x.get('table',[])) for x in rows if isinstance(x,dict)) if isinstance(rows,list) else None})
              if status!=200:output['message']=str(payload.get('message',''))[:180]
              print('RESULT',json.dumps(output,ensure_ascii=False),flush=True)
          f=os.getenv('FOOTBALL_DATA_API_KEY','')
          d=os.getenv('DUNKAPI_API_KEY','')
          request('dunk_nba','https://mcp.dunkapi.com/v1/get_standings',d,'x-api-key',{'season':2027})
          request('football_competitions','https://api.football-data.org/v4/competitions',f,'X-Auth-Token')
          request('football_matches','https://api.football-data.org/v4/matches?dateFrom=2026-10-26&dateTo=2026-11-03',f,'X-Auth-Token')
          request('football_pl_standings','https://api.football-data.org/v4/competitions/PL/standings',f,'X-Auth-Token')
          PY
