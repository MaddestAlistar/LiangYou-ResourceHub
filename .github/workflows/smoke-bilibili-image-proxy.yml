name: Verify live Bilibili cover proxy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-bilibili-image-proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check real verified video image through Worker
        run: |
          node --input-type=module <<'NODE'
          const img='https://i1.hdslb.com/bfs/archive/3bb32693eb30498f4510c53716b11fcb6aab30bf.jpg';
          const path='https://liangyou-streaming-availability.maddestalistar.workers.dev/api/media-cover/bilibili?src='+encodeURIComponent(img);
          try{
            const r=await fetch(path,{signal:AbortSignal.timeout(15000),headers:{Origin:'https://maddestalistar.github.io'}});
            const type=r.headers.get('content-type');
            const bytes=new Uint8Array(await r.arrayBuffer());
            const isJpeg=bytes.length>500&&bytes[0]===255&&bytes[1]===216&&bytes[2]===255;
            console.log('BILIBILI_COVER_PROXY_LIVE',JSON.stringify({http:r.status,type,bytes:bytes.length,
              validJpeg:isJpeg,cors:r.headers.get('access-control-allow-origin')}));
            if(!r.ok||!isJpeg)process.exitCode=1;
          }catch(e){console.error('BILIBILI_COVER_PROXY_LIVE',e.name,e.message);process.exitCode=1;}
          NODE
