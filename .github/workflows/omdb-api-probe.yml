name: Verify OMDb API ratings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/omdb-api-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test OMDb key and rating fields (no credential logging)
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          key = os.environ.get("OMDB_API_KEY","").strip()
          if not key:
              print("OMDB_PROBE",json.dumps({"status":"missing_secret"}))
              raise SystemExit(0)
          query=urllib.parse.urlencode({"i":"tt0137523","apikey":key,"plot":"short"})
          url="https://www.omdbapi.com/?"+query
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"LiangYou-ResourceHub/1.0"}),timeout=20) as r:
                  code=r.status; body=r.read(32768).decode("utf-8","replace")
          except urllib.error.HTTPError as e:
              code=e.code; body=e.read(32768).decode("utf-8","replace")
          except Exception as e:
              print("OMDB_PROBE",json.dumps({"status":"network_error","type":type(e).__name__}))
              raise SystemExit(0)
          try: data=json.loads(body)
          except Exception: data={}
          if code!=200:
              low=body.lower()
              category="invalid_key" if "invalid api key" in low else "inactive_key" if "activated" in low or "activate" in low else "rate_limit" if "limit" in low or "quota" in low else "unauthorized_other"
              print("OMDB_PROBE",json.dumps({"http_status":code,"error_category":category,"json_response":str(data.get("Response","unknown"))}))
          else:
              ratings=data.get("Ratings",[])
              allowed={"Internet Movie Database","Rotten Tomatoes","Metacritic"}
              sources=[r.get("Source") for r in ratings if isinstance(r,dict) and r.get("Source") in allowed]
              result={"http_status":code,"response":data.get("Response"),"imdb_id":data.get("imdbID"),
                      "fields":{"imdbRating":data.get("imdbRating"),"Metascore":data.get("Metascore"),"Ratings":sources},
                      "ratings_count":len(ratings),"error":str(data.get("Error",""))[:80]}
              print("OMDB_PROBE",json.dumps(result))
          PY
