name: Provision Dailymotion site Player (API v2)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provision-dailymotion-player.yml'
      - 'scripts/manage_dailymotion_player.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: liangyou-dailymotion-player-main
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local provisioning script
        run: python -m py_compile scripts/manage_dailymotion_player.py
      - name: Request short-lived OAuth token and provision Player
        env:
          DAILYMOTION_PRIVATE_API_KEY: ${{ secrets.DAILYMOTION_PRIVATE_API_KEY }}
          DAILYMOTION_PRIVATE_API_SECRET: ${{ secrets.DAILYMOTION_PRIVATE_API_SECRET }}
          DAILYMOTION_PROFILE_ID: ${{ vars.DAILYMOTION_PROFILE_ID }}
        run: python scripts/manage_dailymotion_player.py
      - name: Verify public config contains a valid Player ID only
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          config=json.loads(Path("data/media-video-player-config.json").read_text())
          assert config["schema"] == 1
          assert re.fullmatch(r"x[A-Za-z0-9]{3,15}", config["dailymotionPlayerId"])
          assert not any(key.lower() in ("api_key","api_secret","access_token","client_secret")
                         for key in config)
          print("DAILYMOTION_SITE_CONFIG_OK")
          PY
      - name: Commit only public Player ID
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/media-video-player-config.json
          if git diff --cached --quiet; then
            echo 'Dailymotion Player ID already configured'
            exit 0
          fi
          git commit -m 'Configure verified Dailymotion site Player ID [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'DAILYMOTION_PUBLIC_CONFIG_PUBLISHED'
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
          done
