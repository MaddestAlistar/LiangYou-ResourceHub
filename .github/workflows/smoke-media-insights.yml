name: Smoke test six-domain media insights
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-media-insights.yml'
      - 'labs/streaming-availability-worker.mjs'
      - 'media-insights.js'
      - 'media-intel.js'
      - 'scripts/test_media_player.mjs'
      - 'scripts/test_media_insights.mjs'
      - 'scripts/test_media_discovery_order.mjs'
      - 'media-cn-enhance.js'
      - 'media-toolkit.js'
      - 'media-exact-scores.js'
      - 'media-boxoffice-rankings.js'
      - 'scripts/test_media_layout_slots.mjs'
      - 'scripts/test_media_classification.mjs'
      - 'media-intel.css'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate front-end and Worker syntax
        run: |
          node --check labs/streaming-availability-worker.mjs
          node --check media-intel.js
          node --check media-insights.js
          node --check media-toolkit.js
      - name: Test anonymous YouTube playback and media enrichment
        run: node --test scripts/test_media_player.mjs scripts/test_media_insights.mjs scripts/test_media_discovery_order.mjs scripts/test_media_layout_slots.mjs scripts/test_media_classification.mjs
      - name: Verify exact title IDs and optional service behavior
        run: |
          python - <<'PY'
          import json,urllib.request,urllib.error,time
          base='https://liangyou-streaming-availability.maddestalistar.workers.dev'
          for kind,id in [('movie',550),('tv',1399)]:
              u=f'{base}/api/insights/{kind}/{id}?schema=6&media=1'
              req=urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'LiangYou-Insights-Smoke/1.0'})
              with urllib.request.urlopen(req,timeout=65) as r: data=json.load(r)
              assert data.get('ok') is True,(kind,data)
              assert data.get('kind')==kind and data.get('tmdbId')==id,data
              assert isinstance(data.get('classification'),dict),(kind,id,'classification_not_deployed')
              classification=data['classification']
              assert isinstance(classification.get('genres'),list),(kind,id,'genres_not_list')
              assert isinstance(classification.get('keywords'),list),(kind,id,'keywords_not_list')
              rating=classification.get('parental_rating')
              if rating is not None:
                  assert rating.get('source')=='TMDB' and rating.get('country') in ('CN','HK','TW','US','GB','AU','SG','JP','KR') and rating.get('rating'),rating
              print('LIVE_CLASSIFICATION',kind,id,'GENRES',len(classification['genres']),'KEYWORDS',len(classification['keywords']),'RATING',rating)
              assert isinstance(data.get('sources'),dict),data
              assert isinstance(data.get('artwork'),list),data
              assert isinstance(data.get('news'),list),data
              assert isinstance(data.get("trailers"),list),data
              for v in data["trailers"]:
                  assert len(v.get("id",""))==11 and isinstance(v.get("official"),bool),v
              for n in data["news"]:
                  assert n.get("url","").startswith("https://www.theguardian.com/"),n
              assert all(p.get('url','').startswith('https://') for p in data['artwork']),data
              print('VERIFIED_ID',kind,id,'SOURCES',data['sources'])
          # A card only needs the lightweight TMDB classification route.
          for kind,id in [('movie',550),('tv',1399)]:
              u=f'{base}/api/classification/{kind}/{id}?schema=1'
              req=urllib.request.Request(u,headers={'Accept':'application/json','User-Agent':'LiangYou-Card-Classification-Smoke/1.0'})
              with urllib.request.urlopen(req,timeout=35) as r: lightweight=json.load(r)
              assert lightweight.get('ok') is True and lightweight.get('kind')==kind and lightweight.get('tmdbId')==id
              assert lightweight.get('source')=='TMDB' and isinstance(lightweight.get('classification'),dict)
              values=lightweight['classification']
              assert isinstance(values.get('genres'),list) and isinstance(values.get('keywords'),list)
              print('LIVE_LIGHTWEIGHT_CLASSIFICATION',kind,id,'GENRES',len(values['genres']),'KEYWORDS',len(values['keywords']),
                    'RATING',values.get('parental_rating'))
          try:
              with urllib.request.urlopen(base+'/api/news/film',timeout=25) as r: film_news=json.load(r)
              assert film_news.get('status') in ('ok','no_data','not_configured'),film_news
              assert isinstance(film_news.get('articles'),list),film_news
              print('GUARDIAN_LATEST_FILM',film_news['status'],len(film_news['articles']))
          except urllib.error.HTTPError as err:
              if err.code not in (403,429,502,503): raise
              print('GUARDIAN_LATEST_FILM_UPSTREAM_UNAVAILABLE',err.code)
          try:
              with urllib.request.urlopen(base+'/api/anime/mal/1',timeout=25) as r: mal=json.load(r)
              assert mal.get("ok") is True and mal.get("status") in ("ok","not_configured"),mal
              if mal["status"]=="ok":
                  assert mal.get("malId")==1 and isinstance(mal.get("title"),str),mal
              print("MYANIMELIST_V2",mal["status"])
          except urllib.error.HTTPError as err:
              if err.code not in (403,429,502,503): raise
              print("MYANIMELIST_V2_UPSTREAM_UNAVAILABLE",err.code)
          try:
              with urllib.request.urlopen(base+'/api/kobis/daily',timeout=65) as r: kr=json.load(r)
          except urllib.error.HTTPError as err:
              if err.code not in (403,502,503): raise
              print('KOFIC_OPTIONAL_SOURCE_UNAVAILABLE_HTTP',err.code)
              kr={'ok':True,'status':'unavailable','data':[]}
          assert kr.get('ok') is True,kr
          assert kr.get('status') in ('ok','not_configured','unavailable'),kr
          if kr['status']=='ok':
              assert isinstance(kr.get('data'),list),kr
              assert all(isinstance(x.get('rank'),int) and x.get('title') for x in kr['data']),kr
          print('KOREAN_BOX_OFFICE',kr['status'])
          PY
