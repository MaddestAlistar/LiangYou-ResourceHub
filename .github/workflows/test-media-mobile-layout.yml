name: Test mobile film cards and footer alignment
on:
  push:
    branches: [main]
    paths:
      - 'media-intel.css'
      - 'media-intel.js'
      - 'data/media-worldwide-archive.json'
      - 'scripts/test_media_exact_scores.mjs'
      - 'media-boxoffice-rankings.css'
      - 'media-boxoffice-rankings.js'
      - 'media-exact-scores.js'
      - 'media-insights.js'
      - 'scripts/test_media_cn_panels.mjs'
      - 'media-cn-enhance.css'
      - 'media-cn-enhance.js'
      - 'index.html'
      - 'scripts/test_media_mobile_layout.mjs'
      - 'scripts/test_media_discover_browser.mjs'
      - 'data/media-domestic-trailers.json'
      - '.github/workflows/test-media-mobile-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository locally
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/media-http.log 2>&1 &
          sleep 2
      - name: Check 360px and 390px card alignment
        run: node scripts/test_media_mobile_layout.mjs
      - name: Verify trailer and title-matched international and domestic news render together
        run: node scripts/test_media_discover_browser.mjs
      - name: Check domestic independent rating cards and news interactions
        run: node scripts/test_media_cn_panels.mjs
      - name: Check cross-platform verified ratings and worldwide charts
        run: node scripts/test_media_exact_scores.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: film-mobile-layout-debug
          path: |
            /tmp/mobile-film-*.png
            /tmp/media-discover-browser.png
          if-no-files-found: ignore
