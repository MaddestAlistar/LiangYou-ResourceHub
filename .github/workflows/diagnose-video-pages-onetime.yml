name: Diagnose actual Pages video deployment
on:
  push:
    paths:
      - '.github/workflows/diagnose-video-pages-onetime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe deployed GitHub Pages HTML and video assets
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,time
          base="https://maddestalistar.github.io/LiangYou-ResourceHub/"
          files=["","index.html","ly-video.js?v=20261030.2","ly-video.css?v=20261030.2","xhs-player-n90.html"]
          for f in files:
              url=base+f
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (XHS video diagnostic)','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=24) as r:
                      raw=r.read();body=raw.decode('utf-8','replace')
                      print('LIVE',f or '/', 'HTTP',r.status,'bytes',len(raw),'cache',r.headers.get('cache-control'))
                      if f in ('','index.html'):
                          print('PAGE_VIDEO_CHECK',{'tubo': '3eUyzuksTQC' in body,'n90': '7X4yBrtmKpu' in body,'n90_card':'ly-video-n90-title' in body,'css': 'ly-video.css' in body,'js':'ly-video.js' in body,'cards':body.count('class="ly-video-panel"'),'section_order':[body.find('id="liangyou-tech-news"'),body.find('id="liangyou-video"'),body.find('id="interactive-logo"')]})
                      elif f.startswith('xhs-player'):
                          print('PLAYER_N90',{'n90_mp4':'01eaa4e9a60a2e6c01037001a09437ef94' in body, 'no_referrer':'content="no-referrer"' in body})
              except Exception as e:print('LIVE_FAILED',f,type(e).__name__,str(e)[:240])
          PY
