name: Refresh verified film discovery source snapshots
on:
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/update_media_discovery_snapshots.py'
      - '.github/workflows/refresh-media-discovery.yml'
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh-media-discovery
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate script
        run: python -m py_compile scripts/update_media_discovery_snapshots.py
      - name: Retrieve only verified source summaries
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID || secrets.MYANIMELIST_CLIENT_ID }}
          THE_GUARDIAN_API_KEY: ${{ secrets.THE_GUARDIAN_API_KEY || secrets.GUARDIAN_API_KEY }}
          TASTEDIVE_API_KEY: ${{ secrets.TASTEDIVE_API_KEY }}
        run: python scripts/update_media_discovery_snapshots.py
      - name: Publish new snapshots if validated
        run: |
          test -f data/media-discovery-snapshot.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/media-discovery-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified film discovery snapshots [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" = "3" ]; then exit 1; fi
            done
          fi
      - name: Publish updated data to Pages if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_pages.py
