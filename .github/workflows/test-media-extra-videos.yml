name: Verify 20-video film gallery integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-media-extra-videos.yml'
      - 'media-insights.js'
      - 'scripts/test_media_domestic_trailers.mjs'
      - 'scripts/update_media_extra_videos.py'
      - 'scripts/test_media_extra_videos.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check new provider scripts and JS source
        run: |
          node --check media-insights.js
          node --check china-perf.js
          python -m py_compile scripts/update_media_extra_videos.py
          python scripts/test_media_extra_videos.py
      - name: Verify video display regressions and modal
        run: |
          node --test scripts/test_media_domestic_trailers.mjs scripts/test_media_player.mjs scripts/test_media_insights.mjs scripts/test_media_matching.mjs scripts/test_media_layout_slots.mjs scripts/test_media_news_sources.mjs
      - name: Optional manual live probe of two film entries (no commit)
        if: github.event_name == 'workflow_dispatch'
        env:
          EXTRA_VIDEO_BATCH: '2'
          EXTRA_VIDEO_INTERVAL: '2'
        run: |
          python scripts/update_media_extra_videos.py
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path('data/media-extra-videos.json').read_text())
          assert doc['schema']==1
          assert len(doc['items'])==2
          print('LIVE_EXTRA_VIDEO_CHECK',[(k,len(v['videos'])) for k,v in doc['items'].items()])
          PY
      - name: Upload safe probe report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: extra-video-preview
          path: data/media-extra-videos.json
          retention-days: 2
      - name: Verify snapshots and cached update contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/media-extra-videos.json'))
          assert d['schema']==1 and isinstance(d['items'],dict)
          assert 'media-extra-videos.json' in open('media-insights.js').read()
          assert 'extraVideoRows' in open('media-insights.js').read()
          print('VIDEO_ROLLOUT_CONTRACT_OK')
          PY
