name: Probe free indexed Douyin video discovery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_douyin_public_search.py'
      - '.github/workflows/probe-douyin-public-search.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/probe_douyin_public_search.py
