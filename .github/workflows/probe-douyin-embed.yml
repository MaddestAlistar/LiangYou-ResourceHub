name: Verify Douyin official iframe in Pages for Xigua migrated titles
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe_douyin_embeds.py'
      - '.github/workflows/probe-douyin-embed.yml'
permissions:
  contents: read
jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - name: Check real Douyin player in user site iframe
        run: python scripts/probe_douyin_embeds.py
