name: Deploy Icon Review Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'icon-image.mjs'
      - 'scripts/test_icon*.mjs'
      - 'scripts/check_icon_worker.mjs'
      - 'workers/wrangler.jsonc'
      - '.github/workflows/deploy-icon-review.yml'
concurrency:
  group: deploy-icon-review
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify publisher regressions before deploying
        run: node --test scripts/test_icon*.mjs
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/wrangler.jsonc
      - name: Verify deployed version and admin authentication
        run: node scripts/check_icon_worker.mjs
