name: Deploy Icon Review Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - 'scripts/test_icon*.mjs'
      - 'workers/wrangler.jsonc'
      - '.github/workflows/deploy-icon-review.yml'
concurrency:
  group: deploy-icon-review
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify publisher regressions before deploying
        run: node --test scripts/test_icon*.mjs
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/wrangler.jsonc
      - name: Verify deployed version and admin authentication
        run: |
          python3 - <<'PYCODE'
          import json, urllib.request, urllib.error
          base = 'https://liangyou-icon-review.maddestalistar.workers.dev'
          headers = {'Origin': 'https://maddestalistar.github.io'}
          with urllib.request.urlopen(urllib.request.Request(base+'/health', headers=headers), timeout=30) as r:
              data = json.load(r)
          assert data['version'] == '2026-10-25.atomic-v1', data
          try:
              urllib.request.urlopen(urllib.request.Request(base+'/admin', headers=headers), timeout=30)
              raise AssertionError('Admin endpoint must reject unauthenticated requests')
          except urllib.error.HTTPError as e:
              assert e.code == 401, e.code
          print('PASS: deployed version and admin authentication')
          PYCODE
