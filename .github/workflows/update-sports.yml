name: Refresh public sports probabilities

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-sports.yml'
      - 'scripts/update_sports.py'

permissions:
  contents: write

concurrency:
  group: sports-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify updater syntax
        run: python -m py_compile scripts/update_sports.py
      - name: Fetch only published match-winner probabilities
        run: python scripts/update_sports.py
      - name: Commit cached snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public sports probability snapshot [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
