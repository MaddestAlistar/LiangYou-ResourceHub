name: Deploy verified Maoyan public-page research API
on:
  push:
    branches: [main]
    paths: ['labs/verified-maoyan-worker.mjs','.github/workflows/deploy-verified-maoyan.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: liangyou-verified-maoyan
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check independent worker syntax
        run: node --check labs/verified-maoyan-worker.mjs
      - name: Publish only to independent Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy labs/verified-maoyan-worker.mjs --name liangyou-maoyan-verified --compatibility-date 2025-11-05
