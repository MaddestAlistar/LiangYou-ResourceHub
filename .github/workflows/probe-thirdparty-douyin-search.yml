name: One-time compare third-party Douyin search clients (isolated)
on:
  push:
    branches: [test-douyin-thirdparty-20261031]
    paths:
      - '.github/workflows/probe-thirdparty-douyin-search.yml'
      - 'scripts/probe_douyin_search_20261031.py'
permissions:
  contents: read
jobs:
  anonymous-search-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe three open-source Douyin web-search endpoint variants
        run: python -u scripts/probe_douyin_search_20261031.py

  native-tiktokdownloader:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install upstream TikTokDownloader in ephemeral runner
        run: |
          git clone --depth 1 https://github.com/JoeanAmier/TikTokDownloader.git /tmp/TikTokDownloader
          python -m pip install --disable-pip-version-check -q -r /tmp/TikTokDownloader/requirements.txt
      - name: Run genuine project-native search with auto-generated params and no credentials
        run: |
          cd /tmp/TikTokDownloader
          python - <<'PY'
          import asyncio, json
          from src.testers import Params
          from src.interface.search import Search
          async def main():
              async with Params() as params:
                  for title in ('航海王 预告片','名侦探柯南 预告片','青之箱 第二季 预告片'):
                      try:
                          result=await Search(params,keyword=title,channel=1,pages=1,count=10).run(single_page=True)
                          rows=result if isinstance(result,list) else []
                          if rows and isinstance(rows[0],list): rows=rows[0]
                          print('NATIVE_TTD_RESULT '+json.dumps({'title':title,'rows':len(rows),'sample_keys':list(rows[0])[:8] if rows and isinstance(rows[0],dict) else []},ensure_ascii=False),flush=True)
                      except Exception as exc:
                          print('NATIVE_TTD_RESULT '+json.dumps({'title':title,'error':type(exc).__name__,'detail':str(exc)[:120]},ensure_ascii=False),flush=True)
          asyncio.run(main())
          PY
