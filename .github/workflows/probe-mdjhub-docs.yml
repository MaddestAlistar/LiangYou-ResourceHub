name: Probe public MDJ Hub API documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mdjhub-docs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check official documentation publicly without API credentials
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.out=[]
                  self.scripts=[]
              def handle_data(self, data):
                  value=html.unescape(data).strip()
                  if value: self.out.append(value)
              def handle_starttag(self, tag,attrs):
                  if tag=='script':
                      d=dict(attrs)
                      if d.get('src'): self.scripts.append(d['src'])
          for url in ('https://themdjhub.org/docs','https://themdjhub.org/developer/apply'):
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html'})
                  with urllib.request.urlopen(req,timeout=14) as resp:
                      content=resp.read(240000).decode('utf-8','replace')
                      print('DOC_HTTP',url,resp.status,'bytes',len(content))
                  text=Text()
                  text.feed(content)
                  for line in text.out:
                      if re.search(r'API|密钥|鉴权|签名|Bearer|Authorization|endpoint|接口|短剧|排行|app_id',line,re.I):
                          if len(line)<350: print('PUBLIC_DOC_TEXT',line[:230])
                  print('SCRIPT_PATHS',text.scripts[:12])
                  print('PATH_HINTS',list(dict.fromkeys(re.findall(r'/(?:api|docs|openapi|swagger)[a-z0-9/._-]{0,110}',content,re.I)))[:40])
              except Exception as error:
                  print('DOC_REQUEST_FAILED',url,type(error).__name__,str(error)[:160])
          PY
