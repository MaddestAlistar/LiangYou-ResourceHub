name: Probe public MDJ Hub API documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mdjhub-docs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public API docs paths without credentials
        run: |
          python - <<'PY'
          import re,urllib.request,urllib.error,html
          from html.parser import HTMLParser
          urls=['https://themdjhub.org/docs/api','https://themdjhub.org/app.min.js?v=20261101a2','https://themdjhub.org/i18n.js?v=20261101a1']
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/javascript'})
                  with urllib.request.urlopen(req,timeout=15) as r:
                      body=r.read(1800000).decode('utf-8','replace')
                      print('RESPONSE',url,r.status,r.headers.get('Content-Type'),'size',len(body))
                  if '/app.min.js' in url:
                      matches=[]
                      patterns=[r'/(?:api|v1|v2|docs|developer)[a-zA-Z0-9_/?&=.-]{2,160}',
                                r'(?i)(?:api.?key|authorization|bearer|ranking|hotrank|drama|short.?drama|requestAPI|apiDocs|openapi|timestamp)']
                      for pattern in patterns:
                          for m in re.finditer(pattern,body):
                              start=max(0,m.start()-125);end=min(len(body),m.end()+170)
                              fragment=body[start:end].replace('\n',' ')[:380]
                              if fragment not in matches:
                                  matches.append(fragment)
                              if len(matches)>=95:break
                          if len(matches)>=95:break
                      for snippet in matches:print('JS_CONTEXT',snippet)
                  else:
                      for match in re.finditer(r'/(?:api|v1|v2|docs)[a-zA-Z0-9_/?&=.-]{2,100}',body):
                          print('PATH',match.group(0))
                          if match.start()>200000:break
                      print('BODY_TAIL',re.sub(r'\s+',' ',body[-900:])[:400])
              except Exception as e:print('REQUEST_FAILED',url,type(e).__name__,str(e)[:160])
          PY
