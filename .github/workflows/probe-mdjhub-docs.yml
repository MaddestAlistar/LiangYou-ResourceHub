name: Probe public MDJ Hub API documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-mdjhub-docs.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public fields and docs without credentials
        run: |
          python - <<'PY'
          import urllib.request,json,html
          from html.parser import HTMLParser
          class Plain(HTMLParser):
              def __init__(self):super().__init__();self.rows=[]
              def handle_data(self,s):
                  s=html.unescape(s.strip())
                  if s:self.rows.append(s)
          req=urllib.request.Request('https://themdjhub.org/api-docs?v=20261102a1',headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=15) as r:content=r.read(600000).decode('utf-8','replace')
          doc=Plain();doc.feed(content)
          for i,line in enumerate(doc.rows):
              if 118<=i<=237 or 508<=i<=545:print('DOC_LINE',i,line[:370])
          with urllib.request.urlopen('https://themdjhub.org/api/v1/dramas?limit=2&sort=popular',timeout=15) as r:
              data=json.loads(r.read(110000))
          print('API_TOP_KEYS',list(data))
          print('API_META',data.get('meta'))
          for item in (data.get('data') or [])[:2]:
              print('API_SAMPLE_FIELDS',list(item))
              for k in ('id','title','poster','cover','posterUrl','images','contentType','contentTypeLabel','formatType','episodes','releaseDate','status','popularity','platform','genres','score','scoreSource','ratingCount'):
                  if k in item:print('API_FIELD',k,str(item[k])[:220])
          PY
