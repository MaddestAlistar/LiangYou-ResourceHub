name: Publish site changes to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - '*.js'
      - 'assets/**'
      - 'interactive/**'
      - '.github/workflows/publish-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: liangyou-pages-ui-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main with history for deployment verification
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify the Sixfast frontend files exist and JavaScript parses
        run: |
          test -s index.html
          test -s sixfast.css
          test -s sixfast.js
          grep -q 'id="sixfast"' index.html
          node --check sixfast.js
      - name: Request and verify publication to existing branch-based Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_pages.py
