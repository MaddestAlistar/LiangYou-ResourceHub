name: Sync resource catalog metrics
on:
  schedule:
    - cron: "25 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resource-catalog-metrics
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read GitHub subscription data and refresh counts
        run: python scripts/sync_catalog_metrics.py
      - name: Commit catalog changes
        run: |
          if git diff --quiet -- data/projects.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json
          git commit -m "chore: refresh resource catalog counts from GitHub"
          git push
