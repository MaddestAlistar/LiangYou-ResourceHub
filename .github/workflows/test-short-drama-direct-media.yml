name: Verify direct short drama player demo without Cloudflare video proxy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'media-shortdrama-player.js'
      - 'media-intel.css'
      - 'scripts/test_short_drama_direct_media.mjs'
      - 'scripts/test_short_drama_direct_media_browser.mjs'
      - '.github/workflows/test-short-drama-direct-media.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and safe sample player metadata tests
        run: |
          node --check media-shortdrama-player.js
          node --test scripts/test_short_drama_player.mjs
      - name: Check video bytes from external media hosts (never from CF Worker)
        run: node scripts/test_short_drama_direct_media.mjs
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve local site without Cloudflare video proxy
        run: |
          nohup python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/direct-video-site.log 2>&1 &
          sleep 2
      - name: Verify MP4 and HLS real decoding in mobile-sized Chromium
        run: node scripts/test_short_drama_direct_media_browser.mjs
