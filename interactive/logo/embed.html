 <div class="stage" id="stage" aria-label="可拖动旋转、点击发光的立体良哥看未来Logo" role="application">
  <div class="stars" id="stars"></div><div class="halo-back"></div><div class="floor"></div>
  <div class="circles"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div></div>

 <div class="bottom"><div class="hint"><span class="gesture">✧</span><div><strong>拖动旋转 · 点击激活</strong><div>触屏同样支持 · 滚轮缩放</div></div></div>
  <div class="buttons"><button id="btnEnergy" type="button">✦ 能量模式</button><button id="btnSpin" type="button" class="on">⟳ 自动旋转 ON</button><button id="btnReset" type="button">↺ 重置视角</button></div></div>
</div>
<script>
(()=>{
'use strict';
const data='https://raw.githubusercontent.com/MaddestAlistar/3D-Logo/main/assets/logo.png';
const app=document.getElementById('app'),stage=document.getElementById('stage'),logo=document.getElementById('logo'),stars=document.getElementById('stars'),holder=document.getElementById('holder');
const makeLayer=(cl,z)=>{const e=document.createElement('img');e.className='face '+cl;e.alt='';e.draggable=false;e.src=data;e.style.transform=`translateZ(${z}px)`;logo.appendChild(e);return e};
for(let i=0;i<16;i++)makeLayer('depth',-31+i*4);
makeLayer('rim',29);makeLayer('front',35);
const back=makeLayer('back',0);back.style.transform='rotateY(180deg) translateZ(36px)';
for(let i=0;i<65;i++){let e=document.createElement('i');e.className='star';let xx=(i*73.151+17.3)%100,yy=(i*41.73+13.5)%100;e.style.cssText=`left:${xx}%;top:${yy}%;--alpha:${(.2+(i%6)*.12).toFixed(2)};--time:${2.3+i%7*.6}s`;stars.appendChild(e)}
let spin=true,energy=false,drag=false,moved=false,clickStartX=0,clickStartY=0,oldX=0,oldY=0,targetX=-6,targetY=-13,currentX=-6,currentY=-13,zoom=1,last=performance.now(),shock=0;
const energyBtn=document.getElementById('btnEnergy'),spinBtn=document.getElementById('btnSpin'),resetBtn=document.getElementById('btnReset');
function setEnergy(v){energy=v;app.classList.toggle('active',energy);energyBtn.classList.toggle('on',energy);energyBtn.textContent=energy?'✦ 能量模式 ON':'✦ 能量模式';shock=1.0;burst()}
function burst(){for(let j=0;j<22;j++){const e=document.createElement('i');e.className='burst';e.style.setProperty('--angle',(j*360/22+(j%3)*6)+'deg');e.style.setProperty('--distance',(150+(j%6)*34)+'px');stage.appendChild(e);setTimeout(()=>e.remove(),1050)}}
stage.addEventListener('pointerdown',e=>{if(e.button!==0&&e.pointerType==='mouse')return;drag=true;moved=false;clickStartX=oldX=e.clientX;clickStartY=oldY=e.clientY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-oldX,dy=e.clientY-oldY;targetY+=dx*.43;targetX=Math.max(-78,Math.min(78,targetX-dy*.36));oldX=e.clientX;oldY=e.clientY;if(Math.hypot(e.clientX-clickStartX,e.clientY-clickStartY)>8)moved=true});
function end(e){if(!drag)return;drag=false;if(!moved){setEnergy(!energy)}try{stage.releasePointerCapture(e.pointerId)}catch(_){}}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',()=>{drag=false});
stage.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.6,Math.min(1.38,zoom-e.deltaY*.0007))},{passive:false});
energyBtn.addEventListener('click',()=>setEnergy(!energy));spinBtn.addEventListener('click',()=>{spin=!spin;spinBtn.textContent=spin?'⟳ 自动旋转 ON':'⟳ 自动旋转 OFF';spinBtn.classList.toggle('on',spin)});
resetBtn.addEventListener('click',()=>{targetX=-6;targetY=-13;zoom=1;energy=false;app.classList.remove('active');energyBtn.classList.remove('on');energyBtn.textContent='✦ 能量模式'});

// Both official social cards are direct HTTPS links and work without JavaScript.
function frame(now){const dt=Math.min(50,now-last);last=now;if(spin&&!drag)targetY+=dt*.0038;currentX+=(targetX-currentX)*Math.min(1,dt*.0075);currentY+=(targetY-currentY)*Math.min(1,dt*.0075);document.documentElement.style.setProperty('--pitch',currentX+'deg');document.documentElement.style.setProperty('--yaw',currentY+'deg');document.documentElement.style.setProperty('--zoom',zoom+(shock*.045));shock*=.92;if(shock<.001)shock=0;requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
