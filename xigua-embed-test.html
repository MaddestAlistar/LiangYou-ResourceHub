<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>西瓜视频网页嵌入测试 · 良友科技</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#090e20;color:#e8edf9}
*{box-sizing:border-box}body{margin:0;padding:clamp(16px,4vw,42px)}main{max-width:900px;margin:auto}
h1{font-size:clamp(22px,5vw,32px);margin:0 0 12px}
p{line-height:1.7;color:#acb9d0;font-size:14px}
.card{margin-top:20px;border:1px solid #354765;padding:16px;border-radius:18px;background:#111d36}
.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-block:16px}
button{border-radius:12px;padding:11px 14px;border:1px solid #5e83c9;background:#234e9c;color:#fff;font-weight:650;cursor:pointer}
button:focus-visible{outline:3px solid #9daaf8}
.screen{position:relative;aspect-ratio:16/9;border-radius:12px;background:#060a15;overflow:hidden;display:grid;place-items:center}
iframe{width:100%;height:100%;border:0}
small{color:#aab8d4}a{color:#a9c8ff}
</style>
</head>
<body>
<main>
<h1>西瓜视频 · 站内播放独立测试</h1>
<p>这不是正式影视中心的视频来源，也不代表平台已授予全部视频站外播放权限。请在中国大陆的手机网络里点下面按钮，看能否直接在这一页播放。播放器出现或页面载入不等于视频播放成功。</p>
<div class="card">
<div class="buttons">
<button type="button" data-clip="7444746393916277283">测试：名侦探柯南预告</button>
<button type="button" data-clip="7309889994192224783">测试：公开嵌入示例</button>
<button type="button" id="clear">关闭视频</button>
</div>
<div class="screen" id="screen"><small>点击上方按钮加载 iframe</small></div>
<p id="status" role="status">未开始测试</p>
</div>
<p>已知限制：西瓜官方文档只允许部分视频嵌入，而且本次官方公开接口从 GitHub Actions 请求时返回 HTML 而非 JSON。本站不提取媒体直链，也不提供绕过平台播放限制的服务。</p>
<p><a href="./#media">返回影视情报中心</a></p>
</main>
<script>
(function(){
 const screen=document.getElementById('screen'),status=document.getElementById('status');
 const allowed=new Set(['7444746393916277283','7309889994192224783']);
 document.querySelectorAll('button[data-clip]').forEach(button=>button.addEventListener('click',()=>{
  const id=button.dataset.clip;if(!allowed.has(id))return;
  const frame=document.createElement('iframe');
  frame.title='西瓜视频公开 iframe 测试 '+id;
  frame.src='https://www.ixigua.com/iframe/'+id+'?autoplay=0';
  frame.allow='autoplay; fullscreen; picture-in-picture';
  frame.referrerPolicy='strict-origin-when-cross-origin';
  frame.allowFullscreen=true;
  frame.loading='eager';
  screen.replaceChildren(frame);
  status.textContent='已嵌入播放器，请尝试手动点击视频播放。是否能播放需由实际播放结果判断。';
 }));
 document.getElementById('clear').addEventListener('click',()=>{screen.replaceChildren(document.createTextNode('播放器已关闭'));status.textContent='已关闭视频';});
})();
</script>
</body>
</html>
